  .panel.dialog{left:8px;right:8px;bottom:8px;max-height:80%}

  .delta{font-family:'Press Start 2P','Courier New',monospace;font-size:11px;line-height:1.8;margin:6px 0 8px}
  .delta.good{color:var(--green)} .delta.bad{color:var(--red)} .delta.meh{color:var(--gold)}
  .fb{background:#15142a;border-left:4px solid var(--blue);padding:8px 10px;margin-bottom:10px}
  .info{background:#15142a;border-left:4px solid var(--green);padding:8px 10px;margin-bottom:10px}
  .info p,.fb p{margin:0 0 9px} .info p:last-child,.fb p:last-child{margin-bottom:0}
  .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;align-items:center}
  .brief{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px;background:#15142a;padding:10px;margin:8px 0 12px}

  input.clause{font:inherit;font-size:22px;background:#15142a;color:var(--gold);border:3px solid var(--panel-edge);padding:6px 10px;width:150px}

  ul{padding-left:20px;margin:0 0 8px}
  #touch{display:grid;grid-template-columns:auto 1fr auto;align-items:center;margin-top:10px;user-select:none;-webkit-user-select:none}
  .dpad{display:grid;grid-template-columns:repeat(3,44px);grid-template-rows:repeat(3,44px);gap:2px}
  .dpad button,#btnA{font-family:'Press Start 2P','Courier New',monospace;font-size:12px;background:var(--panel);color:var(--paper);border:3px solid var(--panel-edge);cursor:pointer;touch-action:none}
  .dpad button:active,#btnA:active{background:var(--gold);color:var(--ink)}

  #btnA{width:70px;height:70px;border-radius:50%;font-size:14px}
  #help{background:#1a1930;border:4px solid var(--panel-edge);box-shadow:inset 0 0 0 2px #0e0d18;padding:8px 12px;margin-top:8px;color:var(--muted);font-size:17px}
  #msg{font-family:'Press Start 2P','Courier New',monospace;font-size:10px;line-height:1.6;color:var(--gold);min-height:16px;margin-bottom:4px;white-space:pre-wrap}
  #msg.dim{color:var(--muted)}
  .panel.menu{left:0;right:0;bottom:14px;background:transparent;border:0;box-shadow:none;text-align:center;padding:0}
  .menu button{display:block;margin:4px auto;width:220px;text-align:center;font-family:'Press Start 2P','Courier New',monospace;font-size:12px;background:rgba(27,26,46,.85);color:var(--paper);border:3px solid var(--panel-edge);padding:8px 8px;cursor:pointer;position:relative}
  .ini-row{display:flex;gap:18px;justify-content:center;margin:14px 0 6px}
  .ini-slot span{display:block;width:64px;text-align:center;color:var(--muted);font-size:22px;cursor:pointer;user-select:none;-webkit-user-select:none;line-height:1.1}
  .ini-slot span:hover{color:var(--gold)}
  .ini-slot .ch{font-family:'Press Start 2P','Courier New',monospace;font-size:34px;width:64px;height:64px;line-height:64px;text-align:center;border:3px solid var(--panel-edge);color:var(--paper);background:#15142a;cursor:pointer}
  .ini-slot.cur .ch{border-color:var(--gold);color:var(--gold);box-shadow:0 0 0 3px #6a4f10}
  .ini-big{font-family:'Press Start 2P','Courier New',monospace;font-size:26px;color:var(--gold);text-align:center;letter-spacing:8px;margin:2px 0 10px}
  .scores{width:100%;border-collapse:collapse;margin:6px 0 12px}
  .scores th{color:var(--muted);font-family:'Press Start 2P','Courier New',monospace;font-size:8px;text-align:left;padding:4px 6px;border-bottom:2px solid var(--panel-edge)}
  .scores td{padding:4px 6px;border-top:1px solid #3b3a5e;font-variant-numeric:tabular-nums}
  .scores tr.me td{color:var(--gold);background:#2a2740}
  .scores .ini{font-family:'Press Start 2P','Courier New',monospace;font-size:10px;letter-spacing:2px}
  #hud .ini{color:var(--green);letter-spacing:1px}
  .menu button:hover,.menu button:focus-visible{color:var(--gold);border-color:var(--gold);outline:0}

  .fb b.line{display:block;color:var(--gold);margin-bottom:6px}

  #dev select,#dev button{font:inherit;font-size:16px;background:var(--panel);color:var(--paper);border:2px solid var(--panel-edge);padding:4px 8px;cursor:pointer}
  #dev b{color:var(--red);font-family:'Press Start 2P','Courier New',monospace;font-size:9px}
  .nb-room{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:12px;padding:10px;background:#15142a;border-left:4px solid var(--panel-edge)}
  .nb-room.dim{opacity:.45}
  .nb-room h2{margin:0 0 4px} .nb-room .sec{color:var(--blue);font-size:16px;margin-bottom:8px}
  .mini{width:192px;height:144px;image-rendering:pixelated;image-rendering:crisp-edges;border:2px solid var(--panel-edge);flex:none;background:#000}
  .nb-list{flex:1;min-width:220px}
  ul.anchors{list-style:none;padding:0;margin:0} ul.anchors li{margin-bottom:7px;line-height:1.25}
  .anchors .num{display:inline-block;width:18px;height:18px;border-radius:50%;text-align:center;font-family:'Press Start 2P','Courier New',monospace;font-size:8px;line-height:18px;color:var(--ink);margin-right:6px;vertical-align:middle}
  .anchors .st0{color:var(--muted)} .anchors .st0 .num{background:#5a5878} .anchors .st0 .cl{color:#5a5878}
  .anchors .st1 .num{background:var(--blue)} .anchors .st1 .cl{color:var(--blue)}
  .anchors .st2 .num{background:var(--gold)} .anchors .st2 .cl{color:var(--gold)}
  .anchors .cl{font-family:'Press Start 2P','Courier New',monospace;font-size:9px;margin-right:6px}
  .anchors details{margin:4px 0 0 24px}
  .muted{color:var(--muted)}
  @media (min-width:700px){ #touch{display:none} }
  @media (prefers-reduced-motion:reduce){ #hud .bar i{transition:none} }
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <button id="btnNote" type="button"><i class="ico"></i>Notebook</button>
    <div class="line"><span class="ini" id="hIni"></span><span class="score">Score <span id="hScore">0</span></span>
      <span class="stat">Trust <span class="bar trust"><i id="hTrust"></i></span><span class="mandate" id="hMandate"></span></span>
      <span class="stat">Risk <span class="bar risk"><i id="hRisk"></i></span></span>
      <span class="stat hearts" id="hHearts" title="Hearts. Risk at 100 costs one."></span></div>
    <span class="snd"><button type="button" id="btnMusic" title="Music on/off">MUSIC</button><button type="button" id="btnSfx" title="Sound effects on/off">SFX</button><button type="button" id="btnDev" title="Developer bar on/off">DEV</button></span>
    <div class="line"><span class="room" id="hRoom"></span><span class="prog" id="hProg"></span><span class="item" id="hItem"></span><span class="key" id="hKey"></span></div>
  </div>
  <div id="stage">
    <canvas id="game" width="512" height="384"></canvas>
    <div id="overlay"></div>
  </div>
  <div id="touch">
    <div class="dpad">
      <button class="e"></button><button data-k="ArrowUp">▲</button><button class="e"></button>
      <button data-k="ArrowLeft">◀</button><button class="e"></button><button data-k="ArrowRight">▶</button>
      <button class="e"></button><button data-k="ArrowDown">▼</button><button class="e"></button>
    </div>
    <div></div>
    <button id="btnA" type="button">A</button>
  </div>
  <audio id="theme" src="assets/crystal-map.mp3" loop preload="auto"></audio>
  <div id="help"><div id="msg">&nbsp;</div><div class="ctl">Move: arrow keys or WASD. Talk, read, swing laptop: Space or E. Notebook: N. Answer with 1 to 4.</div></div>
  <div id="dev" hidden><b>DEV</b>
    <select id="devRoom"></select>
    <button type="button" id="devJump">Jump to room</button>
    <button type="button" id="devFinish">Finish room</button>
    <button type="button" id="devEnd">End screen</button>
  </div>
</div>

const CASE_INTRO="Somebody exported the risk register from the dev floor on Thursday at 18:03, logged in as Henrik. Henrik was in Aarhus. The server cage log says a visitor called Sven was on the floor. Nobody can tell me who let him in, who approved him, or why nobody moved until Monday. Before I recommend anything to anyone, I want that chain, link by link. Start at the scene, the technological house. Show what you find to people. Then put it on the board by the pond, and tell me which controls would have broken the chain.";
function evCount(){return REQUIRED.filter(id=>S.ev[id]).length;}
function boardCount(){return POSITIONS.filter(p=>S.board[p.id]&&EVIDENCE[S.board[p.id]].pos===p.id).length;}
function boardComplete(){return boardCount()===POSITIONS.length;}
function cardsDone(){return POSITIONS.every(p=>S.cards[p.id]);}
function gainEvidence(id){ if(S.ev[id])return false; S.ev[id]=true; sfx("pickup"); hud(); return true; }
function caseHint(){
  if(S.caseDone)return "The gate is open. Go on.";
  if(cardsDone())return "You have named the controls. The gate should be open.";
  if(boardComplete())return "The chain is on the board. Now tell me which controls would have broken it. At the board.";
  if(!S.ev.badge&&!S.ev.sticky)return "Start at the scene: the technological house. Something was left by the racks, and something is stuck to the console.";
  if(!S.ev.log)return "Jonas has the log of that console. He wants to see something first. Show him what you found at the scene.";
  if(!S.facts.lars_admits&&S.ev.badge)return "A badge like that has a maker. Show it around the people house.";
  if(!S.ev.page)return "Lars said: the bin by the side door. The physical house.";
  if(!S.ev.alert)return "Viktor's model sent a mail. Show Viktor what the log says.";
  if(!S.ev.form)return "Bo's contractor form is in the organisational house. Look at the signature line.";
  if(!S.facts.mette_reviewer)return "Show that alert to Mette. She will tell you why it sat there.";
  return "You have it all. Put it on the board by the pond. Five positions, one item each.";
}
/* talking to a colleague in the case: their line, then the option to show evidence */
function caseTalk(n){
  S.mode="dialog";
  const line=typeof n.talk==="function"?n.talk():n.talk;
  if(n.talkFact&&!S.facts[n.talkFact]){S.facts[n.talkFact]=true;}
  const held=Object.keys(EVIDENCE).filter(id=>S.ev[id]);
  const opts=held.map(id=>({id,t:"Show the "+EVIDENCE[id].name.toLowerCase()}));
  let h=speakerBox(n.name,n.role)+paras(line);
  if(opts.length){h+='<div class="opts'+(opts.length>=5?' five':'')+'">';opts.forEach((o,i)=>{h+='<button type="button" data-i="'+i+'"><b>'+(i+1)+'</b>'+esc(o.t)+'</button>';});h+='</div>';}
  h+='<div class="row"><button class="btn primary" id="go">'+(opts.length?"Nothing, thanks":"OK")+'</button></div>';
  show(h,"dialog");
  S.current={onPick:i=>showEvidence(n,opts[i].id),opts};
  overlay.querySelectorAll(".opts button").forEach(b=>b.onclick=()=>showEvidence(n,opts[+b.dataset.i].id));
  overlay.querySelector("#go").onclick=()=>{hide();S.current=null;S.mode="play";hud();};
}
function showEvidence(n,id){
  S.current=null;
  let r=(n.show&&n.show[id])||n.showDefault||"Not mine. Show it to someone it belongs to.";
  if(typeof r==="string")r={text:r};
  let extra="";
  if(r.give&&!S.ev[r.give]){gainEvidence(r.give);extra+='<div class="delta good">'+esc(EVIDENCE[r.give].name)+' received.</div><div class="info">'+esc(EVIDENCE[r.give].found)+'</div>';}
  if(r.fact&&!S.facts[r.fact]){S.facts[r.fact]=true;sfx("good");extra+='<div class="fb"><b class="line">Noted: '+esc(r.factLine||"a statement for the board.")+'</b></div>';}
  if(r.unlock){const rm=ROOMS.find(x=>x.id===r.unlock.room);const o=rm&&rm.objects.find(x=>x.id===r.unlock.obj);if(o&&o.locked){o.locked=false;extra+='<div class="fb"><b class="line">New lead: '+esc(r.unlock.hint)+'</b></div>';}}
  hud(); sfx("talk");
  show(speakerBox(n.name,n.role)+'<div class="muted" style="margin-bottom:8px">You show the '+esc(EVIDENCE[id].name.toLowerCase())+'.</div>'+paras(r.text)+extra+'<div class="row"><button class="btn primary" id="go">Continue</button></div>',"dialog");
  overlay.querySelector("#go").onclick=()=>{hide();S.mode="play";hud();};
}
/* the case board by the pond */

    return '<div>'+esc(p.label)+'</div><div>'+(id?'<span class="'+(ok?'good-t':'bad-t')+'">'+esc(EVIDENCE[id].name)+'</span> <button type="button" class="btn" data-clear="'+p.id+'" style="font-size:15px;padding:2px 8px">Clear</button>':'<span class="muted">empty</span> <button type="button" class="btn" data-place="'+p.id+'" style="font-size:15px;padding:2px 8px">Place</button>')+'</div>';}).join("");

    '<div class="brief"><div>Evidence</div><div>'+evCount()+' of '+REQUIRED.length+(held.length>evCount()?' <span class="muted">(+'+(held.length-evCount())+' curiosities)</span>':'')+'</div><div>Board</div><div>'+boardCount()+' of '+POSITIONS.length+' supported</div></div>'+
    '<h2>The chain</h2><div class="brief">'+rows+'</div>'+
    (held.length?'<h2>In your pocket</h2><ul>'+held.map(id=>'<li>'+esc(EVIDENCE[id].name)+(S.board[POSITIONS.find(p=>S.board[p.id]===id)?POSITIONS.find(p=>S.board[p.id]===id).id:""]===id?' <span class="muted">(on the board)</span>':'')+'</li>').join("")+'</ul>':'<p class="muted">Nothing in your pocket yet. Start at the scene.</p>')+
    (facts.length?'<h2>Statements</h2><ul>'+facts.map(f=>'<li>'+esc(f)+'</li>').join("")+'</ul>':'')+
    '<div class="row">'+(boardComplete()?'<button class="btn primary" id="connect">'+(cardsDone()?"Read the reconstruction":"Connect the evidence")+'</button>':'')+'<button class="btn" id="close">Close</button></div>',"full");

function placeMenu(pos){
  const p=POSITIONS.find(x=>x.id===pos);
  const held=Object.keys(EVIDENCE).filter(id=>S.ev[id]&&!POSITIONS.some(q=>S.board[q.id]===id));
  if(!held.length){simple("Elisabeth","Certification auditor","Everything you carry is already on the board. Find more, or move something.","OK",showCase);return;}
  S.mode="dialog";
  let h=speakerBox("Elisabeth","Certification auditor")+'<p>'+esc(p.label)+' needs '+esc(p.needs)+'. What goes here?</p><div class="opts'+(held.length>=5?' five':'')+'">';
  held.forEach((id,i)=>{h+='<button type="button" data-i="'+i+'"><b>'+(i+1)+'</b>'+esc(EVIDENCE[id].name)+'</button>';});
  h+='</div><div class="row"><button class="btn" id="back">Back</button></div>';
  show(h,"full");
  const pick=i=>{S.current=null;const id=held[i];S.board[pos]=id;hud();const ok=EVIDENCE[id].pos===pos;sfx(ok?"good":"locked");
    const text=ok?"That holds. "+p.holds:"That proves "+EVIDENCE[id].proves+". It does not give me "+p.needs+". Leave it there if you like, but "+p.label.toLowerCase()+" is still unsupported.";
    show(speakerBox("Elisabeth","Certification auditor")+'<div class="delta '+(ok?'good':'meh')+'">'+(ok?"Supported.":"Not yet.")+'</div><p>'+esc(text)+'</p><div class="row"><button class="btn primary" id="go">Back to the board</button></div>',"dialog");
    overlay.querySelector("#go").onclick=showCase;};
  S.current={onPick:pick,opts:held};
  overlay.querySelectorAll(".opts button").forEach(b=>b.onclick=()=>pick(+b.dataset.i));
  overlay.querySelector("#back").onclick=showCase;
}
function reconstruct(){
  S.mode="dialog"; sfx("read");
  const chain=POSITIONS.map(p=>'<li><span class="cl">'+esc(p.label)+'</span>'+esc(p.holds)+'</li>').join("");
  show('<h1>The chain</h1><ol class="journey">'+chain+'</ol><div class="info">Five links. Not one person. Each link was a process with no owner, and each one handed Sven to the next.</div>'+
    '<div class="row"><button class="btn primary" id="go">'+(cardsDone()?"Back to the board":"Which controls would have broken it?")+'</button></div>',"full");
  overlay.querySelector("#go").onclick=()=>{if(cardsDone()){showCase();}else cardStep(0);};
}
function cardStep(i){
  while(i<POSITIONS.length&&S.cards[POSITIONS[i].id])i++;
  if(i>=POSITIONS.length){caseSolved();return;}
  const p=POSITIONS[i], c=CARDS[p.id];
  const opts=shuffle([{t:c.right.t,ok:true},{t:c.wrong[0].t,why:c.wrong[0].why},{t:c.wrong[1].t,why:c.wrong[1].why}]);
  S.mode="dialog";
  let h=speakerBox("Elisabeth","link "+(i+1)+" of "+POSITIONS.length+": "+p.label)+'<p>'+esc(p.holds)+'</p><p><b>'+esc(c.q)+'</b></p><div class="opts">';
  opts.forEach((o,k)=>{h+='<button type="button" data-i="'+k+'"><b>'+(k+1)+'</b>'+esc(o.t)+'</button>';});
  h+='</div>'; show(h,"full");
  const pick=k=>{S.current=null;const o=opts[k];
    if(o.ok){S.cards[p.id]=true;sfx("good");hud();show(speakerBox("Elisabeth","")+'<div class="delta good">'+esc(c.right.ref)+'</div><p>'+esc(c.right.t)+'</p><div class="fb"><b class="line">'+esc(c.right.why)+'</b></div><div class="row"><button class="btn primary" id="go">'+(i+1<POSITIONS.length?"Next link":"Close the case")+'</button></div>',"full");overlay.querySelector("#go").onclick=()=>cardStep(i+1);}
    else{sfx("bad");show(speakerBox("Elisabeth","")+'<div class="delta meh">Not that one.</div><p>'+esc(o.why)+'</p><div class="row"><button class="btn primary" id="go">Try again</button></div>',"full");overlay.querySelector("#go").onclick=()=>cardStep(i);}};
  S.current={onPick:pick,opts};
  overlay.querySelectorAll(".opts button").forEach(b=>b.onclick=()=>pick(+b.dataset.i));
}
function caseSolved(){
  const g=ROOMS.find(r=>r.hub); S.caseDone=true; g.open=true; g.passed=true; if(g.auditor)g.auditor.cur={x:g.auditor.aside.x,y:g.auditor.aside.y};
  S.trust=clamp(S.trust+10,0,100); S.risk=clamp(S.risk-10,0,100); sfx("clear"); hud(); S.mode="dialog";
  show(speakerBox("Elisabeth","Certification auditor")+'<div class="delta good">Case closed.</div><p>That is a chain, not a culprit. Nobody approved him, nobody checked him, a door stood open, a password lay around, and an alert went to nobody. Five controls, one each, and Sven never gets past the first. Write it up that way. The gate is open.</p><div class="row"><button class="btn primary" id="go">Debrief</button></div>',"full");
  overlay.querySelector("#go").onclick=()=>{hide();showDebrief(()=>{S.mode="play";});};
}

    {t:"Start with 4.1 and 4.2: list the issues, the interested parties and their requirements. The scope in 4.3 comes out of those, and 4.4 builds the ISMS on it.",pts:10,trust:5,risk:-5,fb:"Right order. Context, interested parties and their requirements, interfaces and dependencies, then the scope as documented information. 4.4 then says: establish, implement, maintain and continually improve the ISMS in accordance with the standard."},
    {t:"Write the scope statement first, since it is the first thing the auditor reads. Work out the 4.1 issues and the 4.2 requirements afterwards, to match it.",pts:-5,trust:0,risk:5,fb:"4.3 says the scope is determined considering the issues in 4.1 and the requirements in 4.2. Writing the scope first and back-filling the context is the wrong way round, and it shows in stage 1."},
    {t:"Leave clause 4 for later and start on the Annex A controls. The scope statement can be copied from a certificate template when the auditor asks for it.",pts:-10,trust:0,risk:5,fb:"Clause 4 is where the whole ISMS gets its boundaries and its reasons. Controls without a scope and a context are the classic copy-paste ISMS."}
   ]}
  ]},
  {who:"dpo",x:3,y:9,after:"secintern",wait:"Emil is still working on the scope with you. Sort that out first, then we talk about the law.",idle:"Seventy-two hours. I count them.",
   q:[
   {lookup:"register",
    ask:"GDPR, DORA, NIS2, client contracts, the Bookkeeping Act. Everyone asks me which rules apply to what. I started a register, it is on the bookshelf. Look at it and tell me which 27002 control it satisfies.",
    remind:"The bookshelf, next to the sofa. The red binder.",
    number:{q:"Legal, statutory, regulatory and contractual requirements. Which 27002 control?",a:"5.31"},
    text:"5.31, good. So where does ISO 27001 itself put all of this? Is it my problem or the ISMS's problem?",
    line:"4.2 b: legal and regulatory requirements are interested-party requirements. 5.31 keeps the register and 9.3 reviews it.",
    options:[
    {t:"One requirements register with owners, per 4.2 b and 27002 5.31, reviewed whenever the context or the law changes.",pts:10,trust:5,risk:-5,fb:"4.2 covers interested parties' requirements, legal and regulatory included, and 27002 5.31 keeps them identified, documented and current. It feeds 9.3.2. Mapping requirements to controls stops parallel compliance programmes."},
    {t:"ISO 27001 leaves legal compliance to the DPO. 4.2 covers clients and shareholders, so GDPR and NIS2 stay in your own tracker.",pts:-5,trust:0,risk:5,fb:"4.2 b explicitly includes legal and regulatory requirements among the requirements of interested parties. Regulators are interested parties. Keeping them outside the ISMS means the risk assessment ignores them."},
    {t:"Write 'we comply with all applicable legislation' in the policy. 5.2 b requires that commitment, and the auditor checks the policy.",pts:-3,trust:0,risk:0,fb:"The policy can commit to it (5.2 b), but a commitment without a register is not evidence, and 27002 5.31 asks for the requirements to be identified and documented."}
   ]},
   {text:"Management wants to skip the 'context of the organisation' step. 'We know our business.' What do you tell them?",
    line:"4.1: determine the issues, keep the list short and current, review it at every 9.3 management review.",
    options:[
    {t:"4.1 asks for the internal and external issues relevant to the ISMS. One workshop, one page, kept updated and reviewed.",pts:10,trust:5,risk:-5,fb:"External: regulation, clients, threat landscape, suppliers. Internal: culture, structure, technology, people. It is short, it is reviewed in 9.3.2 as 'changes in external and internal issues', and it justifies your scope."},
    {t:"Agree. 4.1 has no documented information requirement, so the strategy documents suffice and 6.1.2 is where the auditor looks.",pts:-5,trust:0,risk:5,fb:"True that 4.1 has no explicit documented information requirement, but 4.1 still requires the issues to be determined, and 6.1.1 builds the risk planning on 4.1 and 4.2. If you cannot show the auditor what the issues are, the risk assessment has no foundation."},
    {t:"Insist on a full PESTLE and SWOT per business unit and a 30-page context report before any other ISMS work starts.",pts:-3,trust:-5,risk:0,fb:"Proportionality matters. 4.1 is satisfied by a determined, maintained list of issues. A 30-page report nobody reads is documentation for its own sake."}
   ]}
  ]},
  {who:"sales",x:12,y:4,after:"dpo",wait:"Mette first. She has the law on her side, literally.",idle:"Can I quote you on that in the tender?",
   q:[
   {text:"The ministry asks what our scope statement will say. Marketing proposes: 'Chaotic Consulting is fully ISO 27001 compliant across all activities worldwide.' Good?",
    line:"4.3 scope names services, sites, interfaces and justified exclusions. Slogans get audited literally.",
    options:[
    {t:"No. The scope names the services, sites and interfaces covered, with a reference to the SoA. It is a 4.3 output.",pts:10,trust:5,risk:-5,fb:"A typical scope reads: 'The ISMS covering consulting services and the client portal delivered from Copenhagen, Aarhus and Lisbon, in accordance with the SoA version x'. Short, verifiable, and it tells the client exactly what the certificate means."},
    {t:"Yes. The broader the better. 4.3 does not restrict the wording as long as top management approves it and it is in the policy.",pts:-5,trust:0,risk:5,fb:"4.3 requires the scope to be determined from the context (4.1), interested parties (4.2) and interfaces and dependencies, and to be available as documented information. Marketing slogans are not scope statements, and 'worldwide' would be audited literally."},
    {t:"Scope only the consultant laptops, where the client data sits, and leave HQ and finance out to keep the audit cheap.",pts:-5,trust:0,risk:10,fb:"Excluding the systems and locations that the laptops depend on ignores the interfaces and dependencies 4.3 explicitly asks you to consider. A scope carved for audit convenience rarely survives the auditor's first question."}
   ]}
  ]}

 objects:[
  {id:"pc",kind:"pc",x:3,y:2,title:"Reception PC: Context and interested parties (4.1, 4.2)",text:["Welcome to Chaotic Consulting. This screen is the context of the organisation: who we are, what affects us, and who has requirements on us. It is clauses 4.1 and 4.2, and everything after clause 4 stands on it.", "4.1 is about the external and internal issues relevant to the purpose of the organisation that affect the ISMS. External: laws and regulators, clients, the market, the threat landscape, suppliers. Internal: strategy, culture, structure, people, technology.", "4.2 is about interested parties: which ones are relevant, which of their requirements are relevant, and which of those the ISMS will address.", "For Chaotic Consulting that means clients with contracts and security questionnaires, employees, the board, Datatilsynet (GDPR), the NIS2 authority for the ministry engagement, the fintech clients' DORA obligations passed down by contract, insurers and subcontractors.", "9.3.2 b: changes in all of this are reviewed at every management review."]},
  {id:"book",kind:"book",x:2,y:2,item:"book",take:"You take the printed standard. Emil is waiting for it.",title:"Printed copy: ISO/IEC 27001:2022",text:["The printed standard, ISO/IEC 27001:2022. Clauses 4 to 10 are the requirements and they are mandatory: 4 context, 5 leadership, 6 planning, 7 support, 8 operation, 9 performance evaluation, 10 improvement. Annex A at the back lists the 93 reference controls.", "4.3 is about the scope. Determine the boundaries and applicability of the ISMS, considering the issues from 4.1, the requirements from 4.2, and the interfaces and dependencies between what we do ourselves and what other organisations do for us.", "The scope shall be available as documented information.", "4.4 is the whole standard in one sentence: establish, implement, maintain and continually improve an ISMS, including the processes needed and their interactions, in accordance with this document."]},
  {id:"register",kind:"binder",x:11,y:8,title:"Bookshelf: Requirements register (4.2 b, 27002 5.31)",text:["A register of legal, statutory, regulatory and contractual requirements. Each entry has an owner and the controls that address it.", "4.2 b makes legal and regulatory requirements part of the interested parties' requirements. Regulators are interested parties.", "27002 5.31 requires the requirements to be identified, documented and kept up to date, and the organisation's approach to meeting them defined.", "For Chaotic Consulting: GDPR (Datatilsynet), NIS2 via the ministry engagement, DORA via the fintech clients' contracts, the Bookkeeping Act, and every client security schedule.", "Reviewed at the 9.3 management review as changes in the needs and expectations of interested parties."]}

  {who:"ceo",x:7,y:3,idle:"Series B first, certificate second. Or the other way round?",
   trustGate:{min:40,intro:"I am not signing anything for someone the board does not trust yet. Convince me. One question at a time.",pool:[
    {text:"The board asks me why security should report to me and not to IT. One sentence.",line:"5.1: top management is accountable for the ISMS. Others run it, only top management owns it.",options:[

     {t:"Because IT asked for it, and 5.3 lets you delegate the whole thing to them.",pts:-3,trust:0,risk:0,fb:"5.3 assigns roles under top management. It does not move accountability out of the corner office."},
     {t:"Because the auditor said so, and she decides who gets the certificate.",pts:-3,trust:-5,risk:0,fb:"The auditor checks. She does not lead. That answer would lose the board in a second."}
    ]},
    {text:"The board wants the certificate by Q3 or nobody gets a bonus. Honestly: can we?",line:"Honest dates: policy signed, risk owners accepting residual risk, stage 1, then stage 2. Never promise what you cannot defend.",options:[

     {t:"Yes. Whatever it takes. I will make the SoA say what the auditor wants to read.",pts:-5,trust:0,risk:10,fb:"An SoA written for the auditor instead of from the risk assessment is the classic stage 2 major nonconformity. And you just told the CEO you would fake it."},
     {t:"No. Certification takes two years minimum. The board is dreaming.",pts:-3,trust:-5,risk:0,fb:"It is not true, and it is not useful. Twelve to eighteen months is normal for a firm this size with a sponsor."}

    {text:"Pernille says the encryption budget is your problem, not hers. Who owns that risk?",line:"6.1.3 f: the risk owner approves the plan and accepts the residual risk. The implementer owns the process, top management owns the ISMS.",options:[

    ask:"I approved the budget, that should be enough. Somebody scribbled my supposed to-do list on the whiteboard by the window. Read it, tell me which clause makes those demands, and we will discuss how little I can get away with.",
    remind:"The whiteboard. Top right, by the window. Apparently it has my job description on it.",
    number:{q:"The list of what top management has to demonstrate: set policy and objectives, provide resources, direct people, promote improvement. Which clause?",a:"5.1"},
    text:"5.1. Fine. Can you just write the policy, sign it yourself and run this thing from IT? I have a Series B to close.",
    line:"5.1 top management leads, 5.2 top management signs the policy, 5.3 top management assigns the roles. You run it, they own it.",
    options:[
    {t:"You sign it and you own it, that is 5.1 and 5.2. I run it for you, and 5.3 puts my mandate in writing.",pts:10,trust:10,risk:-10,fb:"5.2 says the policy is established by top management, 5.3 has top management assign roles and responsibilities, and 9.3 has top management review the ISMS at planned intervals. The implementer runs the machine, the CEO owns it."},
    {t:"Sure. An ISMS steering group inside IT, I sign the policy as ISMS manager, and you get a status mail every quarter.",pts:-5,trust:5,risk:10,fb:"Clause 5.1 requires top management to demonstrate leadership: ensuring policy and objectives are set, integrating the ISMS into business processes, providing resources, directing people. An ISMS run entirely from IT with a mail to the CEO is the classic stage 1 finding."},
    {t:"Go to the board and have them mandate your involvement in a written resolution, so leadership is formally documented.",pts:-5,trust:-15,risk:0,fb:"The board is an interested party (4.2), but going over the CEO's head in week one destroys the sponsorship you need. Leadership is built with the executive, not around them."}

    text:"5.2, so a policy it is. Can I just approve the 40-page IT policy as the policy and be done?",
    line:"5.2: one short statement signed by top management, communicated to everyone, available to interested parties as appropriate.",
    options:[
    {t:"No. A short top-level statement you sign: purpose, objectives, commitments, that is 5.2. The IT policy hangs under it.",pts:10,trust:5,risk:-5,fb:"5.2 a to g: appropriate to the purpose, includes objectives or a framework for setting them, commits to applicable requirements and to continual improvement, documented, communicated, available to interested parties as appropriate. Short is a feature."},
    {t:"Approve the IT policy as it is, add an appendix mapping each chapter to the ISO clauses, and publish it to the IT team.",pts:-5,trust:0,risk:5,fb:"5.2 requires the policy to be communicated within the organisation, not just to IT, and to be appropriate to the purpose of the organisation. A 40-page IT manual mapped to clauses is not a top management policy statement."},

   q:[

    {t:"Yes. The ISMS is being implemented, 27001 defines no compliance date, and the certification body will confirm it later.",pts:-10,trust:5,risk:15,fb:"Certification is issued by an accredited body after stage 1 and stage 2 audits. A false claim in a public tender can void the contract and, in Denmark, get you excluded from future tenders. It also wrecks the credibility of the ISMS."},
    {t:"Answer 'not applicable' and send them the full risk register instead, so they see we take security seriously.",pts:-5,trust:-5,risk:10,fb:"An unredacted risk register is a map of your weaknesses handed to an outsider. 5.12 classification and 5.14 information transfer apply to your own security documentation too."}

  {id:"whiteboard",kind:"poster",x:12,y:0,title:"Whiteboard: Leadership and commitment (5.1)",text:["Somebody's list of what the CEO has to do. It is clause 5.1, leadership and commitment.", "Top management shall demonstrate leadership by ensuring the policy and objectives are set and compatible with strategy, integrating ISMS requirements into business processes, ensuring resources are available, and communicating the importance of security and of conforming.", "Also: ensuring the ISMS achieves its intended outcomes, directing and supporting people, promoting continual improvement, and supporting other managers in their areas.", "None of it can be delegated. Somebody can run the ISMS for top management. Nobody can own it for them."]},

 npcs:[
  {who:"cfo",x:7,y:4,idle:"Every control has a price. Tell me what I get for it.",
   q:[
   {lookup:"riskposter",
    ask:"My briefcase is gone, with the treatment plan, the SoA draft and the objectives in it. The only copy. Elisabeth is on her way and she will ask how we assess risk. The process is on the poster by the window. Read it, tell me the clause, then help me find that briefcase.",
    remind:"The poster, top of the room, left of the window. The risk assessment process.",
    number:{q:"Risk criteria, identify risks and owners, analyse consequence and likelihood, evaluate against the criteria. Which clause?",a:"6.1.2"},
    text:"6.1.2. Lars drafted the register for me and scored every single risk as 'high'. Better safe than sorry, he says. Is it?",
    line:"6.1.2: criteria first, then identify with owners, analyse consequence and likelihood, evaluate against the criteria.",
    options:[
    {t:"No. Score consequence and likelihood against agreed criteria, as 6.1.2 requires, or nothing can be prioritised for treatment.",pts:10,trust:5,risk:-5,fb:"6.1.2: establish criteria, identify risks and risk owners, analyse (potential consequences, realistic likelihood, resulting level), evaluate (compare with criteria, prioritise for treatment), and retain documented information about the process."},
    {t:"Yes. That is the conservative reading of 6.1.2: every risk gets treated and the SoA shows every control as applicable.",pts:-10,trust:0,risk:5,fb:"6.1.2: criteria, identification with owners, analysis of consequence and likelihood, evaluation against the criteria. 'All high' makes prioritisation impossible and treatment plans meaningless."},
    {t:"Fine for now. 6.1.2 b asks for consistent, valid and comparable results, and 'all high' is at least perfectly consistent.",pts:-5,trust:0,risk:5,fb:"Consistent, yes. Valid and comparable, no. A method that cannot distinguish between risks is not producing comparable results."}
   ]},
   {lookup:"soabinder",
    ask:"The treatment plan is in the briefcase, but the logic behind the SoA is in the binder on the table. Read it and tell me which clause it is. Then I have a budget problem for you.",
    remind:"The red binder on the meeting table. Risk treatment and the SoA.",
    number:{q:"Treatment options, necessary controls, comparison with Annex A, the SoA, the plan, risk owner approval. Which clause?",a:"6.1.3"},
    text:"6.1.3. So: the plan says all 140 laptops need full-disk encryption and device management. That is 250,000 DKK. I cannot approve it this quarter. What now?",
    line:"6.1.3: modify, retain, avoid or share. The risk owner chooses, approves the plan and accepts the residual risk.",
    options:[
    {t:"Modify, retain, share or avoid, per 6.1.3 a. You choose as risk owner and sign off the residual risk under 6.1.3 f.",pts:10,trust:10,risk:-5,fb:"6.1.3: options, controls, Annex A comparison, SoA, plan, and the risk owner's approval and acceptance of residual risk (6.1.3 f). Phased encryption, formal acceptance, insurance, or no local data are all legitimate. 27002: 8.1 endpoint devices, 8.24 cryptography."},
    {t:"Remove it from the register. 6.1.2 repeats the assessment at planned intervals, so an unfunded risk can come back next quarter.",pts:-10,trust:0,risk:15,fb:"Risks do not disappear when they become inconvenient. Deleting a risk from the register is falsification, and 8.2 only allows the assessment to be repeated, not edited for budget reasons."},
    {t:"Implement it anyway by moving money from awareness. 6.1.3 requires every risk above the criteria to be treated before certification.",pts:-5,trust:-10,risk:5,fb:"6.1.3 offers options, including retaining a risk by informed decision. You bypassed the risk owner and traded one control for another without assessing the risk. Resources (7.1) are determined by top management, not reallocated unilaterally."}
   ]},
   {lookup:"objectives",
    ask:"One more before the briefcase. The whiteboard has what Signe wrote down at the objectives workshop this morning. Read it, tell me the clause, and then judge my two objectives.",

    number:{q:"Information security objectives and planning to achieve them. Which clause?",a:"6.2"},

 objects:[
  {id:"riskposter",kind:"poster",x:7,y:0,title:"Poster: The risk assessment process (6.1.2)",text:["The risk assessment process, clause 6.1.2.", "Criteria first. Establish and maintain risk criteria: acceptance criteria and criteria for performing assessments. Repeated assessments shall give consistent, valid and comparable results.", "Identify. Risks to the confidentiality, integrity and availability of information within the scope, and the risk owners for each.", "Analyse. Potential consequences, realistic likelihood, resulting level of risk.", "Evaluate. Compare with the criteria and prioritise for treatment.", "Retain documented information about the process."]},

 coinQ:[
 {text:"Critical CVE on our VPN appliance, exploit code is public. The patch needs two hours of downtime for the client portal. Sales says absolutely not before the quarter closes in three weeks.",options:[
    {t:"Respect the freeze. 8.1 says operate as planned, and the maintenance window is the plan. Log it as an accepted risk and revisit at the next assessment.",pts:-10,trust:0,risk:20,fb:"A public exploit on an internet-facing device is as likely as it gets. 8.1 also says control changes, and 27002 8.8 expects timely, risk-based action. Three weeks of exposure needs a risk owner's signature, and few would give it."},
    {t:"Emergency change tonight. Tell Sales and the CEO what waiting would cost.",pts:10,trust:5,risk:-15,fb:"8.1 operational planning and control, 27002 8.8 vulnerability management, 8.32 change management (emergency changes still get approval and a record), 8.14 redundancy where possible. Explaining the trade-off is 7.4 communication in practice."},
    {t:"Patch it now without telling anyone. 8.1 gives the ISMS authority over operations, and telling Sales only creates resistance.",pts:-3,trust:-10,risk:-5,fb:"The risk goes down, but you bypassed 8.32 change management and 7.4 communication. Unannounced downtime on a client-facing portal creates its own incidents and destroys trust with the business."}
   ]},
 {text:"First-line IT support is outsourced. Their helpdesk resets passwords for anyone who calls and sounds stressed enough.",options:[
    {t:"8.1: externally provided processes are controlled. Identity verification in the contract, checked at the service review.",pts:10,trust:5,risk:-10,fb:"8.1 requires the organisation to ensure that externally provided processes, products or services relevant to the ISMS are controlled. 27002 5.19 to 5.22 supply the how: requirements in the agreement, monitoring, change management."},
    {t:"Not our problem. The helpdesk is a supplier and their own ISO certificate covers their process.",pts:-5,trust:0,risk:10,fb:"Their certificate covers their ISMS, not your risk. Password resets are your access control (5.18), whoever performs them."},
    {t:"Bring first-line support back in-house immediately. 8.1 says processes must be operated by the organisation itself.",pts:-5,trust:-5,risk:0,fb:"8.1 says controlled, not in-house. Insourcing is a business decision, not a requirement of the standard."}
   ]},
 {text:"The team wants an AI coding assistant. It sends our portal source code to a US vendor's cloud. Half the team already uses it on personal accounts. Can we?",options:[
    {t:"Ban it. 8.1 says externally provided processes are controlled, and a US cloud vendor cannot be controlled, so control means exclusion.",pts:-5,trust:-5,risk:5,fb:"8.1 says externally provided processes, products or services relevant to the ISMS are controlled, not excluded. Bans push usage underground. 6.1.3 lists avoid as one option, but here it likely increases shadow IT risk."},
    {t:"Let it run. Developer tools are out of scope, they do not process client data, and shadow usage is an HR issue.",pts:-5,trust:0,risk:10,fb:"Source code of the client portal is one of your most sensitive assets, and it is in scope. 8.1 plus 27002 5.19 to 5.23 treat the vendor as a supplier, and 5.12 classification decides what may leave."},
    {t:"Treat it as a supplier: classify what leaves, assess the vendor, sign a contract, then approve it with rules.",pts:10,trust:5,risk:-10,fb:"8.1 (control of externally provided services), 27002 5.19 supplier relationships, 5.20 security in supplier agreements, 5.23 cloud services, 5.12 classification. Check with the DPO whether personal data sits in the code base. A managed yes beats an ignored no."}
   ]},
 {text:"Jonas wants to roll out a new device management agent to all 140 laptops on Friday afternoon. No change record, 'it is just an agent'.",options:[
    {t:"8.1: planned changes are controlled. A change record, a test group, a rollback plan, and not on a Friday.",pts:10,trust:5,risk:-10,fb:"8.1: implement the plans, control planned changes and review the consequences of unintended changes. 27002 8.32 change management, 8.31 separate environments for the test group."},
    {t:"Let it run. 8.1 covers processes, and installing software is an IT task below the ISMS.",pts:-5,trust:0,risk:10,fb:"An agent with admin rights on every laptop is about as ISMS-relevant as a change gets. 8.1 and 8.32 both apply."},
    {t:"Freeze all changes until certification, so the auditor sees a stable environment.",pts:-5,trust:-5,risk:5,fb:"A change freeze is not control, and it leaves the laptop encryption gap open. The auditor wants to see change management working, not absent."}
   ]},
 {text:"We are migrating the portal from AWS to a smaller Danish hosting provider next month. The risk assessment was done six months ago. Fine?",options:[
    {t:"No. 8.2 says reassess when significant changes occur. This is one.",pts:10,trust:5,risk:-10,fb:"8.2: risk assessments at planned intervals or when significant changes are proposed or occur, and results retained as documented information. 8.3 then implements the updated treatment plan. 6.3 planning of changes covers the ISMS side of the migration."},
    {t:"Yes. 8.2 says planned intervals, and ours is 12 months. Changes are 6.3, a separate process owned by the PMO.",pts:-5,trust:0,risk:10,fb:"8.2 says 'at planned intervals or when significant changes are proposed or occur'. A hosting migration is a significant change. 6.3 is about planning changes to the ISMS, not a substitute for reassessing risk."},
    {t:"Yes, if the new provider is ISO 27001 certified. Their certificate takes the hosting risks off our register.",pts:-10,trust:0,risk:15,fb:"A supplier's certificate does not transfer your risk. Sharing risk (6.1.3) changes who treats it, and 8.1 still requires you to control the externally provided service. The scope of their certificate may not even cover your service."}
   ]},
 {text:"The annual risk reassessment is due. 'Nothing changed this year,' says Pernille, 'skip it.'",options:[
    {t:"No. 8.2 says at planned intervals, and the interval is yours. Run it, record that little changed, and keep the results.",pts:10,trust:5,risk:-5,fb:"8.2: perform risk assessments at planned intervals or when significant changes are proposed or occur, and retain documented information of the results. 'Nothing changed' is itself a result worth recording."},
    {t:"Fine. 8.2 only requires reassessment when significant changes occur, and none did.",pts:-5,trust:0,risk:10,fb:"8.2 says planned intervals OR significant changes. Both triggers apply. And a new hosting provider, DORA and a phishing incident all happened this year."},
    {t:"Skip it, but re-date last year's assessment so the interval looks respected.",pts:-10,trust:-5,risk:10,fb:"Falsified documented information. If the auditor finds it, and they do, it is a major nonconformity and a trust problem you cannot fix."}
   ]},
 {text:"The risk treatment plan says MFA for all admin accounts by June. It is September and it is not done. The auditor comes next week.",options:[
  {t:"Update the plan: new date, reason, risk owner approval, documented.",pts:10,trust:5,risk:-5,fb:"8.3 requires the plan to be implemented and results retained; a slipped action is normal if it is managed. 6.1.3 f keeps the risk owner in the loop, 6.3 covers planned changes. Hiding it is what the auditor looks for."},
  {t:"Remove it from the plan. 8.3 only requires the plan to be implemented, and an action that is not in the plan cannot be missing.",pts:-10,trust:0,risk:15,fb:"Editing the plan to hide a gap is falsification of documented information (7.5) and leaves a high risk untreated with nobody's acceptance."},
  {t:"Enable MFA tonight on one account so you can honestly say the action is 'in progress'.",pts:-5,trust:-5,risk:5,fb:"Technically true and practically misleading. The auditor will ask for the residual risk acceptance and the new date, not for a token gesture."}
 ]},
 {text:"The treatment plan said awareness training for all staff by March. HR ran it. Nobody kept an attendance list.",options:[
  {t:"8.3 implements the plan and retains the results. Reconstruct attendance from the calendar, and record it properly next time.",pts:10,trust:5,risk:-5,fb:"8.3: implement the risk treatment plan and retain documented information of the results. Without a record the control is invisible to 9.1 measurement and to the auditor."},
  {t:"The training happened, so 8.3 is met. Records are a 7.5 nicety.",pts:-5,trust:0,risk:5,fb:"8.3 explicitly requires documented information of the results of the treatment. An untracked control is an unproven control."},
  {t:"Run the whole training again next week, with a signed list this time, and say nothing about March.",pts:-3,trust:-5,risk:0,fb:"Wasteful and slightly dishonest. Reconstruct, record the gap, fix the process."}
 ]}
 ]
},

   {lookup:"page91",item:"p91",
    ask:"Power cut, emergency lighting, and my audit binder went flying. The 9.1 page, monitoring and measurement, is somewhere between the desks on the left. Find it and bring it here. I dropped my flashlight too, somewhere at the back. Take it if you find it.",
    remind:"The 9.1 page, between the desks on the left. And the flashlight, if you find it.",
    deliver:"That is it. Monitoring and measurement. Thank you.",
    number:{q:"Monitoring, measurement, analysis and evaluation. Which clause?",a:"9.1"},
    text:"9.1. My proposal for the company's key security metric: 'number of firewall rules'. Good?",
    line:"9.1: measure what shows effectiveness, tied to the 6.2 objectives. Valid, comparable, analysed, retained.",
    options:[
    {t:"Pick metrics that show whether controls work and objectives are met, for example the share of critical patches applied within 14 days.",pts:10,trust:5,risk:-5,fb:"9.1 evaluates performance and effectiveness. Rule counts describe configuration, not outcome. Metrics should trace back to 6.2 objectives and give comparable, reproducible results."},
    {t:"Fine. 9.1 lets the organisation determine what to monitor, so any number counts as long as it is reproducible and recorded.",pts:-5,trust:0,risk:5,fb:"9.1 also requires the methods to produce valid results and the results to be analysed and evaluated. A number that says nothing about effectiveness fails that test."},
    {t:"Measure everything the SIEM offers, so the auditor cannot claim something was missed.",pts:-5,trust:-5,risk:0,fb:"Volume is not evaluation. 9.1 asks what needs to be monitored, and why. A dashboard nobody reads is not documented evidence of effectiveness."}
   ]},
   {text:"So what goes on the dashboard for management, once the power is back?",
    line:"9.1 monitoring and measurement tied to the 6.2 objectives. Results retained, fed into 9.3.",
    options:[
    {t:"The number of documents produced and of Annex A controls marked applicable in the SoA. That is what 9.1 means by evaluating performance.",pts:-5,trust:-5,risk:0,fb:"9.1 requires you to determine what to monitor and measure, the methods, when, who, and how results are analysed. Document counts are outputs, not performance. Objectives under 6.2 are measurable for this reason."},
    {t:"Metrics tied to the objectives: patch times, phishing report rate, access review completion.",pts:10,trust:10,risk:-5,fb:"9.1 monitoring and measurement tied to 6.2 objectives. Results are retained as documented information and feed 9.3.2 management review. The 2022 text: the organisation shall evaluate the performance and effectiveness of the ISMS."},
    {t:"Send them the raw SIEM export. 9.1 asks for monitoring, and the auditor prefers original evidence to summaries.",pts:-3,trust:-5,risk:0,fb:"9.1 explicitly includes analysis and evaluation. Raw logs are monitoring, not evaluation, and top management cannot review what they cannot read."}
   ]}
  ]},
  {who:"quality",x:12,y:10,after:"it",wait:"Jonas first. He is looking for something in the dark.",idle:"Root cause of the power cut. Say it with me.",
   q:[

    ask:"Jonas's binder. The 9.2 page, internal audit, landed somewhere behind the shelves on the right. Bring it here, then I have a question about who audits what.",
    remind:"The 9.2 page, internal audit. Behind the shelves on the right, under a desk.",
    deliver:"Internal audit. Good.",
    number:{q:"Internal audit: programme, criteria and scope, impartial auditors, results reported and retained. Which clause?",a:"9.2"},
    text:"9.2. I have been asked to audit the risk register I helped build. Can I?",
    line:"9.2.2 c: auditors are objective and impartial. You do not audit your own work.",
    options:[
    {t:"Yes. 9.2 requires competence and nobody knows the register better. Impartiality in 9.2.2 c is about the programme, not each assignment.",pts:-5,trust:0,risk:5,fb:"9.2.2 c: select auditors and conduct audits that ensure objectivity and impartiality of the audit process. Auditing your own work is the textbook conflict, and the certification auditor will flag it."},
    {t:"No. Audit HR or physical security instead. Someone independent audits risk.",pts:10,trust:5,risk:-5,fb:"9.2.1: internal audits at planned intervals against your own requirements and the standard. 9.2.2: a programme, criteria and scope, impartial auditors, results reported to management and retained."},
    {t:"Skip it until after certification. The certification audit is more thorough, and 9.2 lets us set the planned interval later.",pts:-10,trust:0,risk:10,fb:"Internal audit (9.2) must have been performed before the certification audit. Without it the stage 1 audit stops right there."}
   ]}
  ]},

   q:[

    text:"9.3. Thirty minutes. What must be on the agenda?",

    options:[

    {t:"Only the internal audit report and the open nonconformities. 9.3 is the management version of the audit closing meeting.",pts:-5,trust:0,risk:5,fb:"Audit results are one of many inputs listed in 9.3.2. Leaving out the risk picture, objectives and interested party feedback produces a review that cannot make the decisions 9.3.3 requires."},
    {t:"A SIEM demo and a walkthrough of every Annex A control, so top management can verify them personally. That is what review means.",pts:-3,trust:-5,risk:0,fb:"Management review is a decision meeting, not a control test. 9.2 internal audit verifies operation; 9.3 reviews suitability, adequacy and effectiveness and decides on improvements and resources."}

  {id:"page91",kind:"page",x:2,y:7,item:"p91",take:"Page 9.1. Jonas wants it.",title:"Page: Monitoring and measurement (9.1)",text:["A loose page from the audit binder. Clause 9.1, monitoring, measurement, analysis and evaluation.", "Determine what needs to be monitored and measured, including the processes and the controls.", "Determine the methods, so that results are valid and comparable, when it is done, by whom, and when the results are analysed and evaluated.", "Retain documented information as evidence. The organisation shall evaluate the performance and effectiveness of the ISMS.", "Good metrics trace back to the 6.2 objectives: patch times, phishing report rate, access review completion, incidents by category."]},

   {lookup:"improve",
    ask:"Pre-audit dry run. Before I give you the finding, read the binder on the table, nonconformity and corrective action, and tell me which clause covers corrective action. Careful. The numbering changed in 2022.",
    remind:"The binder on the meeting table, right here. Clause 10.",
    number:{q:"Nonconformity and corrective action. Which clause in the 2022 edition?",a:"10.2"},
    text:"10.2, good, not 10.1. Finding: your access review procedure says quarterly, but the last user access review was seven months ago. What is your response?",
    line:"10.2: correct it, find the cause, check for similar gaps, act, verify effectiveness, document all of it.",
    options:[
    {t:"Correct it, find the cause, check for similar gaps, verify the fix worked, and document it. The full 10.2 cycle.",pts:10,trust:5,risk:-5,fb:"The full 10.2 cycle plus 10.1 continual improvement. Exam trap: in the 2022 edition 10.1 is continual improvement and 10.2 is nonconformity and corrective action, swapped from the 2013 order."},
    {t:"Run the review this week and close the finding. 10.2 defines corrective action as eliminating the nonconformity itself.",pts:-3,trust:0,risk:5,fb:"That is correction. 10.2 also requires you to evaluate the need for action to eliminate the cause, check whether similar nonconformities exist or could occur, implement it, review effectiveness, and document the nature of the nonconformity, the actions and the results."},
    {t:"Challenge it. 'Quarterly' was an internal target, and 9.2 only allows findings against the standard, not our own procedures.",pts:-10,trust:-10,risk:5,fb:"9.2.1 a: audits check conformity with the organisation's own requirements as well as the standard. Your procedure is an audit criterion. If quarterly is unrealistic, change it through 6.3 and justify it by risk."}
   ]},
   {text:"Stage 1 prep. Which of these is NOT documented information required by ISO 27001 clauses 4 to 10?",
    line:"Required: scope, policy, risk process, SoA, objectives, competence evidence, 8.1 planning, 8.2 and 8.3 results, 9.1, 9.2, 9.3, 10.2. Not a network diagram.",
    options:[
    {t:"A network diagram of all in-scope systems, often requested as evidence.",pts:10,trust:5,risk:0,fb:"Correct. Often requested as control evidence, never required by clauses 4 to 10. The required set: scope 4.3, policy 5.2, risk process 6.1.2 and 6.1.3, SoA, objectives 6.2, competence evidence 7.2, operational planning 8.1, risk results 8.2 and 8.3, monitoring 9.1, audit 9.2, management review 9.3, nonconformities 10.2."},
    {t:"The ISMS scope, since 4.3 only says it shall be 'determined' and available, which a verbal agreement satisfies.",pts:-5,trust:-5,risk:0,fb:"4.3 requires the scope to be available as documented information. The answer was the network diagram."},
    {t:"The Statement of Applicability, since 6.1.3 d only requires it to be produced during treatment, not retained afterwards.",pts:-5,trust:-5,risk:0,fb:"6.1.3 d makes the SoA mandatory, and 6.1.3 ends with retaining documented information about the process. The answer was the network diagram."},
    {t:"The results of management reviews, since 9.3.3 only requires decisions, and decisions can be minuted anywhere.",pts:-5,trust:-5,risk:0,fb:"9.3.3 requires documented information as evidence of the results of management reviews. The answer was the network diagram."}

    line:"10.1: the ISMS gets more suitable, adequate and effective. Shown from 9.1 results, 9.2 findings, 9.3 decisions, 10.2 actions.",
    options:[
    {t:"Improvement is the ISMS getting more suitable, adequate and effective. Show it from audit results, metrics and review decisions, not from a purchase.",pts:10,trust:5,risk:-5,fb:"10.1: continually improve the suitability, adequacy and effectiveness of the ISMS. Sources: 9.1 results, 9.2 findings, 9.3 decisions, 10.2 corrective actions. A tool can be part of it if a review decided it for a reason."},
    {t:"Yes. A new control is by definition an improvement, and the SoA update proves it.",pts:-3,trust:0,risk:0,fb:"A tool nobody tuned can make the ISMS less effective. Improvement is measured by outcome, not by spend."},

function addMiss(q,a,lost){
  if(!a)return; const rec=Math.max(1,Math.ceil(lost/2));
  const ex=S.missed.find(m=>m.a===a); if(ex){ex.recover=Math.max(ex.recover,rec);return;}
  S.missed.push({q,a,recover:rec});
}

function progress(r){
  const qTotal=r.npcs.reduce((s,n)=>s+n.q.length,0), qDone=r.npcs.reduce((s,n)=>s+n.done,0);
  const req=r.objects.filter(o=>!o.optional), oTotal=req.length, oDone=req.filter(o=>o.read).length;

const INI_KEY="isms-quest.ini", ALPHA="ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";

function showInitials(){
  S.mode="initials";

  ini={c:last.split("").filter(ch=>ALPHA.includes(ch)).slice(0,3),p:0}; while(ini.c.length<3)ini.c.push("A");
  const slots=[0,1,2].map(i=>'<div class="ini-slot" data-i="'+i+'"><span data-d="1">&#9650;</span><div class="ch"></div><span data-d="-1">&#9660;</span></div>').join("");
  show('<h1 style="text-align:center">Enter your initials</h1><p class="muted" style="text-align:center">Three letters, arcade style. Arrow keys to pick, Enter to start. Or just type them.</p><div class="ini-row">'+slots+'</div>'+
    '<div class="row" style="justify-content:center"><button class="btn primary" id="go">Start</button><button class="btn" id="back">Back</button></div>',"full");
  overlay.querySelectorAll(".ini-slot").forEach(el=>{
    el.querySelector(".ch").onclick=()=>{ini.p=+el.dataset.i;paintIni();};
    el.querySelectorAll("span").forEach(sp=>sp.onclick=()=>{ini.p=+el.dataset.i;iniStep(+sp.dataset.d);});
  });
  overlay.querySelector("#go").onclick=iniStart; overlay.querySelector("#back").onclick=()=>{sfx("select");showTitle();};
  paintIni();
}
function paintIni(){overlay.querySelectorAll(".ini-slot").forEach((el,i)=>{el.classList.toggle("cur",i===ini.p);el.querySelector(".ch").textContent=ini.c[i];});}
function iniStep(d){const i=ALPHA.indexOf(ini.c[ini.p]);ini.c[ini.p]=ALPHA[(i+d+ALPHA.length)%ALPHA.length];sfx("select");paintIni();}
function iniKey(e){
  if(e.key==="ArrowUp")iniStep(1); else if(e.key==="ArrowDown")iniStep(-1);
  else if(e.key==="ArrowLeft"||e.key==="Backspace"){ini.p=(ini.p+2)%3;paintIni();} else if(e.key==="ArrowRight"){ini.p=(ini.p+1)%3;paintIni();}
  else if(e.key==="Enter")iniStart(); else if(e.key==="Escape")showTitle();
  else if(/^[a-zA-Z0-9]$/.test(e.key)){ini.c[ini.p]=e.key.toUpperCase();sfx("select");ini.p=Math.min(2,ini.p+1);paintIni();}
  else return;
  e.preventDefault();
}
function iniStart(){
  S.initials=ini.c.join(""); try{localStorage.setItem(INI_KEY,S.initials);}catch(e){}

function loadScores(){ try{const l=JSON.parse(localStorage.getItem(SCORES_KEY)||"[]");return Array.isArray(l)?l:[];}catch(e){return [];} }
function sortScores(l){return l.sort((a,b)=>b.score-a.score||(a.time||0)-(b.time||0));}
function recordScore(e){
  const l=sortScores(loadScores().concat([e])).slice(0,50);
  try{localStorage.setItem(SCORES_KEY,JSON.stringify(l));}catch(x){}
  if(SCORE_API){try{fetch(SCORE_API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(e)}).catch(()=>{});}catch(x){}}
  return {list:l,rank:l.indexOf(e)+1};
}
function fetchScores(){
  if(!SCORE_API)return Promise.resolve(loadScores());

}

function roomIndexOf(v){

  const n=parseInt(v,10); if(!isNaN(n))return n>=1&&n<=ROOMS.length?n-1:-1;

function finishRoom(){
  const r=room();
  if(r.hub){ REQUIRED.forEach(id=>{S.ev[id]=true;}); POSITIONS.forEach(p=>{S.board[p.id]=REQUIRED.find(id=>EVIDENCE[id].pos===p.id);S.cards[p.id]=true;}); S.caseDone=true; r.open=true; r.passed=true; if(r.auditor)r.auditor.cur={x:r.auditor.aside.x,y:r.auditor.aside.y}; hide(); S.mode="play"; hud(); S.banner={text:"DEV: case solved. The gate is open.",until:S.t+240}; return; }
  if(r.caseHouse){ r.objects.forEach(o=>{o.locked=false;if(o.evidence&&!o.read){o.read=true;S.ev[o.evidence]=true;}}); hide(); S.mode="play"; hud(); S.banner={text:"DEV: evidence in this house collected.",until:S.t+240}; return; }
  if(r.boss){ if(!S.boss)startBoss(); S.boss.hp=0; hide(); bossWin(); return; }
  if(r.maze){ if(!S.maze)startMaze(); S.maze.tokens=r.need; r.open=true; r.passed=true; hide(); showDebrief(()=>{S.mode="maze";}); return; }
  if(r.pitches){ r.open=true; r.passed=true; hide(); showDebrief(()=>{S.mode="play";}); return; }
  r.hackDone=true; S.fw=null;
  r.objects.forEach(o=>{o.locked=false;if(!o.read){o.read=true;S.read.push(o);}});
  r.npcs.forEach(n=>{n.q.forEach(sc=>{sc.asked=true;sc.numDone=true;sc.delivered=true;});n.done=n.q.length;});
  Object.values(ITEMS).forEach(k=>{if(k!=="hasLaptop")S[k]=false;});
  if(r.auditor){S.player.x=(r.auditor.cur.x-1)*TILE;S.player.y=r.auditor.cur.y*TILE;S.player.face=1;}
  hide(); S.mode="play"; hud();
  S.banner={text:"DEV: room marked complete. You are next to Elisabeth. Press Space.",until:S.t+240};
}

function enterRoom(i){
  S.roomIdx=i; const r=room(); r.visited=true; musicPlay(r.id); S.banner=null;
  if(!r.passed)r.open=false;   // a door only opens by passing the room
  if(r.caseHouse){r.open=true;}   // the case houses are free to enter and leave
  S.player.x=r.entry.x*TILE; S.player.y=r.entry.y*TILE; S.player.face=1;
  S.mode="dialog"; hud();
  show('<h1>'+esc(r.name)+'</h1><p style="color:var(--blue)">'+esc(r.section)+'</p>'+paras(r.passed&&r.pitches?"Done here. The suppliers are packing up. Bo is not.":r.purpose)+'<div class="row"><button class="btn primary" id="go">'+(r.boss?"Fight":(r.maze?"Run":"Go"))+'</button></div>',"full");
  overlay.querySelector("#go").onclick=()=>{
    hide(); S.rs={start:Date.now(),score:S.score,trust:S.trust,risk:S.risk,logIdx:S.log.length};
    if(r.boss){ if(r.taunt&&!r.tauntDone){r.tauntDone=true;simple("Sven","External management consultant",r.taunt,"Bring it",()=>{startBoss();hud();},"full");} else startBoss(); }
    else if(r.maze){ if(r.gate&&!r.gateDone){r.gateDone=true;openScenario(null,r.gate,()=>{startMaze();hud();});} else startMaze(); }
    else if(r.side&&r.pitches){ if(r.passed)S.mode="play"; else startStage(); }
    else if(r.hub){ if(!r.introDone){r.introDone=true;simple("Elisabeth","Certification auditor",CASE_INTRO,"On it",()=>{S.mode="play";hud();S.banner={text:"The scene is the technological house, bottom right. The board is by the pond.",until:S.t+300};},"full");} else S.mode="play"; }
    else { S.mode="play"; if(S.hasLaptop&&r.npcs.some(n=>n.returns&&!n.returned))S.banner={text:"You still carry the company laptop. Someone in here wants it back (5.11).",until:S.t+300}; }
    hud();
  };
}
function fmtT(s){s=Math.max(0,Math.round(s));return Math.floor(s/60)+":"+String(s%60).padStart(2,"0");}
function roomMax(r){
  let m=0;
  r.npcs.forEach(n=>n.q.forEach(q=>{if(q.options)m+=Math.max(...q.options.map(o=>o.pts));if(q.number)m+=5;if(q.item)m+=(q.reward?q.reward.pts:5);}));
  m+=r.objects.length*2; m+=r.objects.filter(o=>o.code).length*5;
  r.objects.forEach(o=>{if(o.scene)m+=Math.max(...o.scene.options.map(x=>x.pts));});
  if(r.gate)m+=Math.max(...r.gate.options.map(x=>x.pts));
  if(r.pitches)m+=r.pitches.length*10;
  r.npcs.forEach(n=>{if(n.returns)m+=(n.returns.reward?n.returns.reward.pts:10);}); m+=(AUDIT_COUNT[r.id]||0)*5;
  if(r.maze)m+=r.coins.length*10; if(r.boss)m+=20+4*5; if(r.hacker)m+=15;
  return m;
}
/* ---------- end of room debrief ---------- */
function showDebrief(then){
  const r=room(), rs=S.rs||{start:Date.now(),score:S.score,trust:S.trust,risk:S.risk,logIdx:0};
  const elapsed=(Date.now()-rs.start)/1000;
  let bonus=0;
  if(!r.debriefed){r.debriefed=true;if(r.par&&elapsed<=r.par){bonus=10;S.score+=10;}}
  const got=S.score-rs.score, max=r.hub?Math.max(got,1):roomMax(r)+(r.par?10:0);
  const pct=max?got/max:0, stars=r.hub?3:(pct>=0.8?3:(pct>=0.55?2:1));   // the case is solved or it is not
  r.stars=Math.max(r.stars||0,stars); recordBest(r,stars);
  let hintLine="";
  if(!r.hintGiven){r.hintGiven=true;if(S.risk<=25&&S.hints<3){S.hints++;hintLine='<div class="info"><b>Risk at '+S.risk+'.</b> Low exposure earns a hint token. You have '+S.hints+'. Spend one on any question with the Hint button.</div>';}}
  const dT=S.trust-rs.trust, dR=S.risk-rs.risk;
  const arrow=(v,upGood)=>{const good=upGood?v>0:v<0;const cls=v===0?"":(good?"good-t":"bad-t");return '<span class="'+cls+'">'+(v>0?"▲ +"+v:(v<0?"▼ "+v:"— no change"))+'</span>';};
  const journey=(r.summary||[]).map(s=>'<li><span class="cl">'+esc(s.clause)+'</span><b>'+esc(s.anchor)+'.</b> '+esc(s.line)+'</li>').join("");
  const missed=S.log.slice(rs.logIdx).filter(l=>l.grade!=="g");
  const missedHtml=missed.length?'<ul class="log">'+missed.map(l=>'<li class="'+l.grade+'">'+esc(l.who)+': '+esc(l.q||l.a)+'</li>').join("")+'</ul>':'<p class="good-t">Nothing missed. Clean room.</p>';
  hud(); S.mode="dialog";
  show('<h1>'+esc(r.name)+' cleared <span class="stars">'+"★".repeat(stars)+'<span class="off">'+"★".repeat(3-stars)+'</span></span></h1>'+
    '<div class="brief"><div>Score this room</div><div>'+got+' of '+max+' (total '+S.score+')</div>'+
    '<div>Time</div><div>'+fmtT(elapsed)+(r.par?' <span style="color:var(--muted)">par '+fmtT(r.par)+'</span>'+(bonus?' <span class="good-t">+10 speed bonus</span>':''):'')+'</div>'+
    '<div>Trust</div><div>'+arrow(dT,true)+'</div><div>Risk</div><div>'+arrow(dR,false)+'</div></div>'+
    '<h2>The journey. Walk it back.</h2><ol class="journey">'+journey+'</ol>'+
    (r.remember?'<div class="info"><b>One to remember:</b> '+esc(r.remember)+'</div>':'')+hintLine+
    '<h2>Missed</h2>'+missedHtml+
    '<div class="row"><button class="btn primary" id="go">'+(r.final?"Walk to the gate":"Continue")+'</button><button class="btn" id="nb">Notebook</button></div>',"full");
  overlay.querySelector("#go").onclick=()=>{hide();then();hud();};
  overlay.querySelector("#nb").onclick=()=>showNotebook(()=>showDebrief(then));
}

/* ---------- scenarios ---------- */
function openScenario(npc,sc,after){
  S.mode="dialog";
  const sp=npc?{name:npc.name,role:npc.role}:sc.speaker;
  const opts=sc.fixed?sc.options.slice():shuffle(sc.options);
  S.current={npc,sc,opts,after};
  let h=speakerBox(sp.name,sp.role)+paras(sc.text)+'<div class="opts'+(opts.length>=5?' five':'')+'">';
  opts.forEach((o,i)=>{h+='<button type="button" data-i="'+i+'"><b>'+(i+1)+'</b>'+esc(o.t)+'</button>';});
  h+='</div>'+hintButton();
  show(h,npc||after?"dialog":"full");
  overlay.querySelectorAll(".opts button").forEach(b=>b.onclick=()=>choose(+b.dataset.i));
  wireHint(()=>sc.line||"No anchor line for this one. Think about which clause the question keeps naming.");
}
/* hint tokens: earned by finishing a room with risk at 25 or below, spent to reveal the anchor line */
function hintButton(){return S.hints>0?'<div class="row"><button type="button" class="btn" id="hint">Hint ('+S.hints+' left)</button></div>':'';}
function wireHint(textFn){
  const b=overlay.querySelector("#hint"); if(!b)return;
  b.onclick=()=>{ if(S.hints<=0)return; S.hints--; sfx("read"); hud(); const d=document.createElement("div"); d.className="fb"; d.innerHTML='<b class="line">'+esc(textFn())+'</b>'; b.parentNode.replaceWith(d); };
}
function choose(i){
  const c=S.current; if(!c) return;
  const o=c.opts[i];
  const best=Math.max(...c.sc.options.map(x=>x.pts));
  const good=o.pts>=best;
  const mandate=good&&o.pts>0&&S.trust>=MANDATE_AT;   // full mandate: good calls count double
  const pts=mandate?o.pts*2:o.pts;
  S.score+=pts; bump(o.trust,o.risk); sfx(good?"good":"bad");
  const who=c.npc?c.npc.name+" ("+c.npc.role+")":(c.sc.speaker?c.sc.speaker.name:"Token");
  S.log.push({who,q:c.sc.text,a:o.t,pts,grade:good?"g":(o.pts>=0?"m":"b")});
  if(!good){const m=CLAUSE_RE.exec(c.sc.line||"");if(m)addMiss("You missed this one: '"+c.sc.text.slice(0,110)+(c.sc.text.length>110?"...":"")+"' Which clause or control was it about?",m[1],best-o.pts);}
  if(c.npc) c.npc.done++;
  S.current=null; hud();
  const cls=good?"good":(o.pts>=0?"meh":"bad");
  const verdict=good?"Good call.":(o.pts>=0?"Not wrong, not enough.":"That will cost you.");
  const fmt=v=>(v>0?"+":"")+v;
  const fbHtml=c.sc.line
    ?'<div class="fb"><b class="line">'+esc(c.sc.line)+'</b></div><details'+(good?'':' open')+'><summary>Why?</summary><div class="fb">'+esc(o.fb)+'</div></details>'
    :'<div class="fb">'+esc(o.fb)+'</div>';
  show(speakerBox(who,"")+
    '<div class="delta '+cls+'">'+verdict+' Score '+fmt(pts)+(mandate?' (mandate x2)':'')+', Trust '+fmt(o.trust)+', Risk '+fmt(o.risk)+'</div>'+
    fbHtml+
    '<div class="row"><button class="btn primary" id="go">Continue</button></div>',c.npc||c.after?"dialog":"full");
  overlay.querySelector("#go").onclick=()=>{hide(); checkIncident(()=>{ if(c.after){c.after(good);} else if(!c.npc&&!c.sc.speaker.role.startsWith("Server")){enterRoom(0);} else {S.mode=playMode();hud();} });};
}

/* ---------- info objects ---------- */
function markRead(o){ if(!o.read){o.read=true;S.score+=2;S.read.push(o);} hud(); }
function openObject(o){
  if(o.kind==="board"){showCase();return;}
  if(o.evidence){
    if(o.locked){S.mode="dialog";show(speakerBox(o.title,"")+paras(o.lockedText||"Nothing here for you. Yet.")+'<div class="row"><button class="btn primary" id="go">OK</button></div>',"dialog");overlay.querySelector("#go").onclick=()=>{hide();S.mode="play";};return;}
    const ev=EVIDENCE[o.evidence], fresh=!o.read; o.read=true; gainEvidence(o.evidence); S.mode="dialog";
    show(speakerBox(o.title,"")+(fresh?'<div class="delta good">'+esc(ev.name)+' found.</div>':'')+'<div class="info">'+esc(ev.found)+'</div>'+(ev.pos?'':'<p class="muted">Probably not for the board. Somebody will have an opinion about it.</p>')+'<div class="row"><button class="btn primary" id="go">Take it</button></div>',"dialog");
    overlay.querySelector("#go").onclick=()=>{hide();S.mode="play";hud();};
    return;
  }
  if(o.kind==="laptop"){ o.read=true; S.hasLaptop=true; hud(); sfx("pickup"); simple(o.title,"",o.text,"Take it"); return; }
  if(o.kind==="hacklap"){
    const done=!!room().hackDone; sfx(done?"read":"locked"); if(done)markRead(o); S.mode="dialog";
    show(speakerBox(o.title,"")+'<div class="info">'+paras(done?o.text:o.before)+'</div><div class="row"><button class="btn primary" id="go">'+(done?"Noted":"Right")+'</button></div>',"dialog");
    overlay.querySelector("#go").onclick=()=>{hide();S.mode="play";hud();};
    return;
  }
  if(o.locked){
    S.mode="dialog"; sfx("locked");
    show(speakerBox(o.title.split(":")[0],"")+'<p>'+esc(o.lockedText||"Nothing you need here yet. Someone will point you at it when it matters. Talk to people first.")+'</p><div class="row"><button class="btn primary" id="go">OK</button></div>',"dialog");
    overlay.querySelector("#go").onclick=()=>{hide();S.mode="play";};
    return;
  }
  if(o.code&&!o.read){codePrompt(o);return;}
  if(o.scene&&!o.read){
    const sc={speaker:{name:o.title,role:""},text:o.text,line:o.scene.line,options:o.scene.options};
    sfx("read");
    openScenario(null,sc,()=>{markRead(o);S.mode="play";hud();});
    return;
  }
  let extra="";
  if(o.item){
    if(!o.read){S[ITEMS[o.item]]=true;extra=o.take||("You take the "+o.item+". Bring it to whoever asked for it.");}
    else if(S[ITEMS[o.item]]){extra="You are carrying it already.";}
  }
  sfx(o.item&&S[ITEMS[o.item]]&&!o.read?"pickup":"read");
  markRead(o);
  S.mode="dialog";
  show(speakerBox(o.title,"")+'<div class="info">'+paras(o.text)+'</div>'+(extra?'<div class="fb">'+esc(extra)+'</div>':'')+
    '<div class="row"><button class="btn primary" id="go">Noted</button></div>',"dialog");
  overlay.querySelector("#go").onclick=()=>{hide();S.mode="play";hud();};
}
function codePrompt(o){
  S.mode="dialog";
  const name=o.title.split(":")[0];
  show(speakerBox(name,"locked")+'<p>'+esc(o.lockedText||"Locked. The code is a clause number.")+'</p><div class="row"><input class="clause" id="ans" autocomplete="off" inputmode="decimal" placeholder="e.g. 4.3"><button class="btn primary" id="go">Open</button></div>',"dialog");
  const inp=overlay.querySelector("#ans");
  const submit=()=>{
    if(normalize(inp.value)===o.code){
      markRead(o); S.score+=5; if(o.item)S[ITEMS[o.item]]=true; hud(); sfx("unlock");
      show(speakerBox(name,"open")+'<div class="delta good">Click. +5</div>'+(o.slip?'<div class="fb">'+esc(o.slip)+'</div>':'')+'<div class="info">'+paras(o.text)+'</div><div class="row"><button class="btn primary" id="go">Noted</button></div>',"dialog");
      overlay.querySelector("#go").onclick=()=>{hide();S.mode="play";hud();};
    }else{
      S.score-=3; hud(); sfx("bad");
      show(speakerBox(name,"locked")+'<div class="delta bad">'+esc(o.wrongText||"It does not open.")+' -3</div>'+(o.hint?'<p>'+esc(o.hint)+'</p>':'')+'<div class="row"><button class="btn primary" id="go">Step back</button></div>',"dialog");
      overlay.querySelector("#go").onclick=()=>{hide();S.mode="play";};
    }
  };
  inp.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();submit();}});
  overlay.querySelector("#go").onclick=submit;
}

/* ---------- auditor and clause quiz ---------- */
function normalize(s){return String(s).trim().toLowerCase().replace(/,/g,".").replace(/\s+/g,"").replace(/^clause/,"").replace(/^a\./,"").replace(/\.$/,"");}
function answerOk(v,q){const n=normalize(v);return n===normalize(q.a)||(q.alt||[]).some(x=>normalize(x)===n);}
function talkAuditor(){
  const r=room(); const p=progress(r);
  if(r.open){simple("Elisabeth","Certification auditor",r.final?"The gate is open. Go on, before I change my mind.":"The door is open. Go on.");return;}
  if(!p.complete){
    const missing=[];
    if(!p.questDone)missing.push("Pernille still does not have her briefcase");
    if(!p.hackDone)missing.push("somebody in a hoodie is still on Henrik's laptop");
    if(p.qDone<p.qTotal)missing.push((p.qTotal-p.qDone)+" question"+(p.qTotal-p.qDone>1?"s":"")+" still waiting for you");
    if(p.oDone<p.oTotal)missing.push((p.oTotal-p.oDone)+" item"+(p.oTotal-p.oDone>1?"s":"")+" in this room you have not read");
    simple("Elisabeth","Certification auditor","Not yet. I audit rooms, not intentions. "+missing.join(", and ")+".");
    return;
  }
  if(r.hub){simple("Elisabeth","Certification auditor",caseHint());return;}
