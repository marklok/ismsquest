/* ---------- maze (server room) ---------- */
function startMaze(){
  const r=room();
  S.maze={tokens:0,grace:0,coins:r.coins.map(c=>({x:c.x,y:c.y,taken:false})),qs:shuffle(r.coinQ),qi:0,
    hunters:r.hunters.map(h=>({who:h.who,mode:h.mode,speed:h.speed,caught:h.caught,x:h.x*TILE,y:h.y*TILE,tx:h.x,ty:h.y,dx:0,dy:0}))};
  S.player.x=r.entry.x*TILE; S.player.y=r.entry.y*TILE;
  S.mode="maze"; hud();
}
function neighbours(x,y){return [[1,0],[-1,0],[0,1],[0,-1]].filter(d=>walkable(x+d[0],y+d[1]));}
function hunterDecide(h,pc,pr){
  const nb=neighbours(h.tx,h.ty);
  const straightOk=walkable(h.tx+h.dx,h.ty+h.dy)&&(h.dx||h.dy);
  const atJunction=nb.length>=3;
  let d=null;
  if(h.mode==="chase"){
    if(!straightOk||atJunction||Math.random()<0.1){const n=nextStep(h.tx,h.ty,pc,pr);if(n)d=[n.x-h.tx,n.y-h.ty];}
  }else{
    const sameRow=h.ty===pr&&clearLine(h.tx,h.ty,pc,pr), sameCol=h.tx===pc&&clearLine(h.tx,h.ty,pc,pr);
    if(sameRow||sameCol){d=[Math.sign(pc-h.tx),Math.sign(pr-h.ty)];}
    else if(!straightOk||(atJunction&&Math.random()<0.5)){
      const opts=nb.filter(o=>!(o[0]===-h.dx&&o[1]===-h.dy));
      const pool=opts.length?opts:nb; d=pool[Math.floor(Math.random()*pool.length)];
    }
  }
  if(d&&!d[0]&&!d[1])d=null;
  if(!d){ if(straightOk)d=[h.dx,h.dy]; else if(nb.length)d=nb[0]; else return; }
  h.dx=d[0];h.dy=d[1];h.tx+=h.dx;h.ty+=h.dy;
}
function clearLine(x1,y1,x2,y2){
  if(x1===x2){for(let y=Math.min(y1,y2);y<=Math.max(y1,y2);y++)if(!walkable(x1,y))return false;return true;}
  if(y1===y2){for(let x=Math.min(x1,x2);x<=Math.max(x1,x2);x++)if(!walkable(x,y1))return false;return true;}
  return false;
}
function mazeReset(text,who){
  S.score-=5; bump(0,5); sfx("hurt");
  const sp=PEOPLE[who||"hunter"];
  S.mode="dialog";
  show(speakerBox(sp.name,sp.role)+'<div class="delta bad">'+esc(text)+' -5</div><div class="row"><button class="btn primary" id="go">Start over</button></div>',"full");
  overlay.querySelector("#go").onclick=()=>{hide();checkIncident(()=>startMaze());};
}
function mazeCaught(text,who){
  const r=room(), m=S.maze, sp=PEOPLE[who||"hunter"];
  S.hearts--; sfx("hurt"); hud(); S.mode="dialog";
  if(S.hearts<=0){
    S.score-=5; bump(0,5);
    show(speakerBox(sp.name,sp.role)+'<div class="delta bad">'+esc(text)+' That was your last heart. -5</div><p>Hearts back to three, tokens back to zero. The maze starts over.</p><div class="row"><button class="btn primary" id="go">Start over</button></div>',"full");
    overlay.querySelector("#go").onclick=()=>{hide();S.hearts=MAX_HEARTS;hud();checkIncident(()=>startMaze());};
    return;
  }
  show(speakerBox(sp.name,sp.role)+'<div class="delta bad">'+esc(text)+' You lose a heart.</div><p>'+S.hearts+' left. Back to the door. Your '+m.tokens+' token'+(m.tokens===1?'':'s')+' stay with you.</p><div class="row"><button class="btn primary" id="go">Back to the door</button></div>',"full");
  overlay.querySelector("#go").onclick=()=>{
    hide(); S.player.x=r.entry.x*TILE; S.player.y=r.entry.y*TILE;
    m.hunters.forEach((h,i)=>{const d=r.hunters[i];h.x=d.x*TILE;h.y=d.y*TILE;h.tx=d.x;h.ty=d.y;h.dx=0;h.dy=0;});
    m.grace=90; S.mode="maze"; hud();
  };
}
function nextStep(sx,sy,tx,ty){
  if(sx===tx&&sy===ty)return null;
  const key=(x,y)=>y*COLS+x, prev=new Map(), queue=[[sx,sy]]; prev.set(key(sx,sy),null);
  while(queue.length){
    const [x,y]=queue.shift(); if(x===tx&&y===ty)break;
    for(const d of [[1,0],[-1,0],[0,1],[0,-1]]){const nx=x+d[0],ny=y+d[1];if(!walkable(nx,ny)||prev.has(key(nx,ny)))continue;prev.set(key(nx,ny),key(x,y));queue.push([nx,ny]);}
  }
  if(!prev.has(key(tx,ty)))return null;
  let cur=key(tx,ty), p=prev.get(cur);
  while(p!==null&&p!==key(sx,sy)){cur=p;p=prev.get(cur);}
  return {x:cur%COLS,y:Math.floor(cur/COLS)};
}
function walkable(c,rr){if(c<0||rr<0||c>=COLS||rr>=ROWS)return false;const ch=room().map[rr][c];return ch==="."||ch==="R";}
function mazeUpdate(){
  const m=S.maze, p=S.player;
  if(m.grace>0){m.grace--;}
  const pc=Math.floor((p.x+16)/TILE), pr=Math.floor((p.y+16)/TILE);
  for(const h of m.hunters){
    const speed=m.grace>0?0:h.speed+(m.tokens>=3?0.3:0);
    const gx=h.tx*TILE, gy=h.ty*TILE;
    if(Math.abs(h.x-gx)<=speed&&Math.abs(h.y-gy)<=speed){h.x=gx;h.y=gy;if(speed>0)hunterDecide(h,pc,pr);}
    else{h.x+=Math.sign(gx-h.x)*Math.min(speed,Math.abs(gx-h.x));h.y+=Math.sign(gy-h.y)*Math.min(speed,Math.abs(gy-h.y));}
    if(Math.hypot((h.x+16)-(p.x+16),(h.y+16)-(p.y+16))<22){mazeCaught(h.caught,h.who);return;}
  }
  m.coins.forEach(c=>{
    if(c.taken)return;
    if(Math.hypot((c.x*TILE+16)-(p.x+16),(c.y*TILE+16)-(p.y+16))<16){c.taken=true;sfx("coin");coinQuestion();}
  });
}
function coinQuestion(){
  const m=S.maze, r=room();
  const sc=m.qs[m.qi%m.qs.length]; m.qi++;
  const scen={text:sc.text,options:sc.options,speaker:{name:"AI token","role":"Server room, Bo is closing in"}};
  openScenario(null,scen,good=>{
    if(good)m.tokens++;
    m.grace=75;
    hud();
    const left=m.coins.filter(c=>!c.taken).length;
    if(m.tokens>=r.need&&!r.open){r.open=true;r.passed=true;sfx("clear");showDebrief(()=>{S.banner={text:"Five tokens. The door is open. Run.",until:S.t+200};m.grace=75;S.mode="maze";});return;}
    if(m.tokens+left<r.need){mazeReset(r.wasted,"ai");return;}
    S.mode="maze";
  });
}

function startBoss(){

function bossUpdate(){
  const b=S.boss, p=S.player;
  if(b.stun>0){b.stun--;}
  else{
    const dx=(p.x-b.x),dy=(p.y-b.y),d=Math.hypot(dx,dy)||1;
    const sp=(0.5+0.45*b.hits)*(b.angry>0?1.25:1); b.angry=Math.max(0,b.angry-1);   // slow to start, faster with every hit
    const nx=b.x+dx/d*sp, ny=b.y+dy/d*sp;
    if(!tileBlocked(nx,b.y))b.x=nx; if(!tileBlocked(b.x,ny))b.y=ny;
    b.fireT--;
    if(b.fireT<=0){
      b.fireT=(b.angry>0?100:160)-25*b.hits;
      const ang=Math.atan2(p.y-b.y,p.x-b.x), sv=1.5+0.45*b.hits;
      const spread=[[0],[-0.3,0.3],[-0.4,0,0.4],[-0.5,-0.2,0.2,0.5]][Math.min(3,b.hits)];
      spread.forEach(o=>{b.shots.push({x:b.x+16,y:b.y+16,vx:Math.cos(ang+o)*sv,vy:Math.sin(ang+o)*sv});});
    }
  }
  b.shots=b.shots.filter(s=>{
    s.x+=s.vx; s.y+=s.vy;
    if(SOLID.has(tileAt(s.x,s.y))||s.x<0||s.y<0||s.x>cv.width||s.y>cv.height)return false;
    if(b.inv<=0&&s.x>p.x+6&&s.x<p.x+26&&s.y>p.y+6&&s.y<p.y+30){hurt();return false;}
    return true;
  });
  if(b.inv>0)b.inv--; if(b.cool>0)b.cool--;
  if(b.inv<=0&&b.stun<=0&&Math.hypot(b.x-p.x,b.y-p.y)<22){hurt();}
}

  const b=S.boss; b.php--; b.inv=75; hud(); sfx("hurt");

function swing(){
  const b=S.boss, p=S.player; if(!b||b.cool>0)return;
  const lap=room().objects[0];
  if(!S.hasLaptop){
    if(Math.hypot((lap.x*TILE)-p.x,(lap.y*TILE)-p.y)<40){sfx("pickup");S.hasLaptop=true;lap.read=true;S.read.push(lap);S.score+=2;hud();S.banner={text:"Laptop picked up. Now get close to Sven.",until:S.t+150};}
    else{S.banner={text:"You need the laptop. It is behind Sven.",until:S.t+120};}
    return;
  }
  if(Math.hypot(b.x-p.x,b.y-p.y)>44){b.cool=15;sfx("swing");return;}

/* The notebook is an earned floor plan: one mini map per room, one marker per anchor.
   0 = not found (grey ?), 1 = read (blue), 2 = recalled: the player produced the number themselves (gold). */
function anchorState(r,s){
  if(s.obj){const o=r.objects.find(x=>x.id===s.obj);if(!o)return 0;return o.recalled?2:(o.read?1:0);}
  return r.debriefed?1:0;
}
function markRecalledByClause(r,a){
  (r.summary||[]).forEach(s=>{
    if(!s.obj)return;
    const clauses=s.clause.split(",").map(x=>x.trim().split(" ")[0]);
    if(clauses.includes(a)){const o=r.objects.find(x=>x.id===s.obj);if(o&&o.read)o.recalled=true;}
  });
}
function drawMini(cv,r,marks){
  const c=cv.getContext("2d"),T=8; c.imageSmoothingEnabled=false;
  for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){
    const ch=r.map[y][x]; let col=((x+y)%2?r.pal.fb:r.pal.fa);
    if(ch==="W"||ch==="N")col=r.pal.wall; else if(ch==="E"||ch==="O"||ch==="X")col="#f2c14e"; else if(ch==="R")col=r.pal.rug; else if(ch!==".")col=r.pal.wallBot;
    c.fillStyle=col; c.fillRect(x*T,y*T,T,T);
  }
  if(!marks)return;
  (r.summary||[]).forEach((s,i)=>{
    if(!s.obj)return; const o=r.objects.find(x=>x.id===s.obj); if(!o)return;
    const st=anchorState(r,s), cx=o.x*T+T/2, cy=o.y*T+T/2;
    c.fillStyle="#1b1a2e"; c.beginPath(); c.arc(cx,cy,6,0,7); c.fill();
    c.fillStyle=st===2?"#f2c14e":(st===1?"#7cc0ff":"#5a5878"); c.beginPath(); c.arc(cx,cy,5,0,7); c.fill();
    c.fillStyle="#1b1a2e"; c.font="bold 8px monospace"; c.textAlign="center"; c.textBaseline="middle"; c.fillText(st?String(i+1):"?",cx,cy+0.5);
  });
}
function showNotebook(back){
  const prev=S.mode; S.mode="notebook";
  let found=0,rec=0,total=0;
  ROOMS.forEach(r=>(r.summary||[]).forEach(s=>{total++;const st=r.visited?anchorState(r,s):0;if(st>=1)found++;if(st===2)rec++;}));
  const cards=ROOMS.map((r,i)=>{
    const vis=!!r.visited;
    const items=(r.summary||[]).map((s,k)=>{
      const st=vis?anchorState(r,s):0, o=s.obj?r.objects.find(x=>x.id===s.obj):null;
      if(st===0)return '<li class="st0"><span class="num">?</span><span class="cl">?.?</span>'+(s.obj?'Not found yet.':'Clear the room to fill this in.')+'</li>';
      return '<li class="st'+st+'"><span class="num">'+(k+1)+'</span><span class="cl">'+esc(s.clause)+'</span><b>'+esc(s.anchor)+'.</b> '+esc(s.line)+
        (o?'<details><summary>Read it again</summary><div class="fb">'+paras(o.text)+'</div></details>':'')+'</li>';
    }).join("");
    const bs=Math.max(r.stars||0,(bestStars()[r.id]||0));
    const stars=bs?' <span class="stars" title="best across all runs">'+"★".repeat(bs)+'<span class="off">'+"★".repeat(3-bs)+'</span></span>':'';
    return '<div class="nb-room'+(vis?'':' dim')+'"><canvas class="mini" data-room="'+i+'" width="128" height="96"></canvas>'+
      '<div class="nb-list"><h2>'+(i+1)+'. '+esc(r.name)+stars+'</h2><div class="sec">'+esc(r.section)+'</div>'+
      (vis?'<ul class="anchors">'+items+'</ul>':'<p class="muted">Not visited yet.</p>')+'</div></div>';
  }).join("");
  show('<h1>Notebook</h1>'+
    '<div class="brief"><div>Anchors found</div><div>'+found+' of '+total+'</div><div>Recalled</div><div>'+rec+' of '+total+'</div></div>'+
    '<p class="muted">Grey: not found. Blue: read. Gold: you produced the number yourself, to a colleague or to the auditor. Walk each room back in your head, marker by marker.</p>'+
    cards+
    '<details><summary>Your decisions</summary>'+logHtml()+'</details>'+
    '<div class="row"><button class="btn primary" id="close">Close</button></div>',"full");
  overlay.querySelectorAll("canvas.mini").forEach(cv=>{const r=ROOMS[+cv.dataset.room];drawMini(cv,r,!!r.visited);});
  overlay.querySelector("#close").onclick=()=>{ if(back){back();return;} hide(); S.mode=prev==="notebook"?"play":prev; };
}

function bump(dTrust,dRisk){
  S.trust=clamp(S.trust+(dTrust||0),0,100);
  if(dRisk>0)dRisk=Math.round(dRisk*1.5);   // exposure climbs faster than it falls
  S.risk=clamp(S.risk+(dRisk||0),0,100);
  riskFlags();
}
function riskFlags(){
  if(S.risk>=100){S.risk=65;S.hearts--;S.incident=true;}
  if(S.risk>75&&!S.riskAlert){S.riskAlert=true;S.incidentScene=true;}
  if(S.risk<=75)S.riskAlert=false;
}
function checkIncident(next){
  if(!S.incident&&S.incidentScene){
    S.incidentScene=false; sfx("alarm");
    const sc=MID_INCIDENTS[S.midIdx++%MID_INCIDENTS.length];
    simple("Incident","risk exposure above 75","Exposure is above 75, and something just happened.","Deal with it",()=>openScenario(null,{speaker:{name:"Incident",role:"risk exposure above 75"},text:sc.text,line:sc.line,options:sc.options},()=>next()),"dialog");
    return;
  }
  if(!S.incident){next();return;}
  S.incident=false; hud(); sfx("alarm");
  const inc=INCIDENTS[Math.floor(Math.random()*INCIDENTS.length)];
  if(S.hearts<=0){gameOver(inc);return;}
  S.mode="dialog";
  show(speakerBox("Incident","risk exposure hit 100")+'<div class="delta bad">'+esc(inc)+' You lose a heart.</div>'+
    '<p>The incident is on the table now, so exposure drops back to 65. Hearts do not come back. '+S.hearts+' left.</p>'+
    '<div class="row"><button class="btn primary" id="go">Deal with it</button></div>',"dialog");
  overlay.querySelector("#go").onclick=()=>{hide();next();};
}
function resetRoom(r){

  r.npcs.forEach(n=>{n.done=0;n.returned=false;n.q.forEach(sc=>{sc.asked=false;sc.numDone=false;sc.delivered=false;sc.misses=0;});});
  r.objects.forEach(o=>{o.read=false;o.recalled=false;o.locked=!!r.gated&&!o.open;});

  r.hackDone=false; S.fw=null;

}

    '<p>Third incident this quarter. The board suspends the ISMS programme, the certification date moves a year, and Henrik stops answering your mails.</p>'+

function annexesDone(h){return h.annexes.filter(id=>{const a=ROOMS.find(x=>x.id===id);return a&&a.passed;}).length;}
function nextAnnex(h){for(const id of h.annexes){const a=ROOMS.find(x=>x.id===id);if(a&&!a.passed)return a;}return null;}
function enterSide(i,door){ S.stack.push({idx:S.roomIdx,rs:S.rs,door}); sfx("door"); enterRoom(i); }
function returnFromSide(r){
  const top=S.stack.pop();
  const pi=top?top.idx:ROOMS.findIndex(x=>x.id===r.returnTo);
  const parent=ROOMS[pi]; S.roomIdx=pi; musicPlay(parent.id);
  if(top&&top.rs)S.rs=top.rs;
  if(top&&top.door){S.player.x=top.door.x*TILE;S.player.y=(top.door.y+1)*TILE;}
  else{const d=parent.sideDoor||parent.entry;let sp=null;for(const v of [[0,-1],[-1,0],[1,0],[0,1]]){const ch=parent.map[d.y+v[1]]&&parent.map[d.y+v[1]][d.x+v[0]];if(ch==="."||ch==="R"){sp={x:d.x+v[0],y:d.y+v[1]};break;}}sp=sp||{x:d.x,y:d.y-2};S.player.x=sp.x*TILE;S.player.y=sp.y*TILE;}
  S.player.face=1; S.mode="play"; hud();
  if(parent.hub){
    S.banner={text:"Back in the garden. Evidence "+evCount()+" of "+REQUIRED.length+"."+(parent.open?" The gate is open.":(boardComplete()?" The chain is on the board. Elisabeth is waiting.":" The board is by the pond, Elisabeth by the gate.")),until:S.t+260};
    hud(); return;
  }

}
function startStage(){
  const r=room(); let i=0, wrong=0;
  const ask=(retry)=>{
    const p=r.pitches[i], sp=PEOPLE[p.who];
    const options=SUPPLIER_CONTROLS.map(([num,name])=>num===p.answer
      ?{t:num+" "+name,pts:10,trust:5,risk:-5,fb:p.fb}
      :{t:num+" "+name,pts:-5,trust:0,risk:5,fb:"Not "+num+". "+p.hint});
    const sc={speaker:{name:sp.name,role:sp.role+", pitch "+(i+1)+" of "+r.pitches.length},text:(retry?"Let me say it again, slower. ":"")+p.text,options,fixed:true,line:p.answer+": "+(r.summary[i]?r.summary[i].line:"")};
    openScenario(null,sc,good=>{
      if(!good){wrong++;ask(true);return;}

      r.open=true; r.passed=true; sfx("clear");
      simple("Bo","Procurement","That is all three. "+(wrong?"It took you "+wrong+" extra round"+(wrong>1?"s":"")+", but you got there. ":"First time, every time. ")+"The door behind you is open. I will deal with the suppliers.","Debrief",()=>showDebrief(()=>{S.mode="play";hud();}));
    });

function sfx(name){
  if(!sfxOn)return; const c=audioCtx(); if(!c)return; const steps=SFX[name]; if(!steps)return;
  const t0=c.currentTime+0.01;
  steps.forEach(st=>{
    const at=t0+(st.at||0), end=at+st.d, g=c.createGain();
    g.gain.setValueAtTime(0.0001,at); g.gain.linearRampToValueAtTime(st.v||.2,at+0.006); g.gain.exponentialRampToValueAtTime(0.0001,end);
    g.connect(c.destination);
    let src;
    if(st.n){
      const len=Math.max(1,Math.ceil(c.sampleRate*st.d)), buf=c.createBuffer(1,len,c.sampleRate), d=buf.getChannelData(0);
      for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
      src=c.createBufferSource(); src.buffer=buf;
      const fl=c.createBiquadFilter(); fl.type="lowpass"; fl.frequency.value=st.f||1200; src.connect(fl); fl.connect(g);
    }else{
      src=c.createOscillator(); src.type=st.w||"square"; src.frequency.setValueAtTime(st.f,at);
      if(st.e)src.frequency.exponentialRampToValueAtTime(st.e,end);
      src.connect(g);
    }
    src.start(at); src.stop(end+0.03);
  });
}

  if(e.target&&e.target.closest&&e.target.closest("#dev"))e.target.blur();   // keys belong to the game, not the dev bar
  if(S.mode==="play"||S.mode==="boss"||S.mode==="maze"){
    if(k.startsWith("Arrow")){S.keys.add(k);e.preventDefault();}
    if(e.key===" "||e.key==="e"||e.key==="E"||e.key==="Enter"){action();e.preventDefault();}
    if(e.key==="n"||e.key==="N"){sfx("select");showNotebook(null);}
  }else if(S.mode==="fw"){
    if(k.startsWith("Arrow")){S.keys.add(k);e.preventDefault();}
  }else if(S.mode==="initials"){
    iniKey(e);
  }else if(S.mode==="dialog"&&S.current){
    const n=parseInt(e.key,10);
    if(n>=1&&n<=S.current.opts.length){ if(S.current.onPick)S.current.onPick(n-1); else if(S.current.boss)bossCounter(n-1); else choose(n-1); }
  }else if(S.mode==="notebook"&&(e.key==="Escape"||e.key==="n"||e.key==="N")){
    const b=overlay.querySelector("#close"); if(b) b.click();
  }
});
window.addEventListener("keyup",e=>{const k=KMAP[e.key]||e.key;S.keys.delete(k);});
document.querySelectorAll(".dpad button[data-k]").forEach(b=>{
  const k=b.dataset.k;
  const on=e=>{e.preventDefault();S.keys.add(k);}; const off=e=>{e.preventDefault();S.keys.delete(k);};
  b.addEventListener("pointerdown",on);b.addEventListener("pointerup",off);b.addEventListener("pointerleave",off);b.addEventListener("pointercancel",off);
});
document.getElementById("btnA").addEventListener("pointerdown",e=>{e.preventDefault();if(S.mode==="play"||S.mode==="boss"||S.mode==="maze")action();});

/* ================= logic ================= */
function tileAt(px,py){const c=Math.floor(px/TILE),r=Math.floor(py/TILE);if(c<0||r<0||c>=COLS||r>=ROWS)return "W";const ch=room().map[r][c];if(ch==="O")return room().open?".":"W";if(ch==="X"||ch==="A")return ".";return ch;}
function occupied(px,py){
  const c=Math.floor(px/TILE),r=Math.floor(py/TILE),rm=room();
  if(rm.npcs.some(n=>n.x===c&&n.y===r&&!npcHidden(n)))return true;
  if(rm.auditor&&rm.auditor.cur.x===c&&rm.auditor.cur.y===r)return true;
  if(rm.objects.some(o=>o.kind==="cabinet"&&o.x===c&&o.y===r))return true;
  return false;
}
function tileBlocked(x,y){const pts=[[x+7,y+18],[x+24,y+18],[x+7,y+31],[x+24,y+31]];return pts.some(p=>SOLID.has(tileAt(p[0],p[1])));}
function blocked(x,y){const pts=[[x+7,y+18],[x+24,y+18],[x+7,y+31],[x+24,y+31]];return pts.some(p=>SOLID.has(tileAt(p[0],p[1]))||occupied(p[0],p[1]));}
function update(){
  S.t++;
  if(S.t%60===0&&saveArmed&&S.mode!=="title"&&S.mode!=="end"&&S.mode!=="initials"&&S.mode!=="brief")S.playSec++;
  if(S.mode==="fw"){fwUpdate();return;}
  if(S.mode!=="play"&&S.mode!=="boss"&&S.mode!=="maze")return;
  const p=S.player; let dx=0,dy=0;
  if(S.keys.has("ArrowLeft"))dx-=2; if(S.keys.has("ArrowRight"))dx+=2;
  if(S.keys.has("ArrowUp"))dy-=2; if(S.keys.has("ArrowDown"))dy+=2;
  p.moving=dx!==0||dy!==0;
  if(dx){
    if(!blocked(p.x+dx,p.y))p.x+=dx;
    else{const ay=Math.round(p.y/TILE)*TILE;if(Math.abs(ay-p.y)<=12&&!blocked(p.x+dx,ay)){p.y+=Math.sign(ay-p.y)*2;}}
    p.face=dx<0?-1:1;
  }
  if(dy){
    if(!blocked(p.x,p.y+dy))p.y+=dy;
    else{const ax=Math.round(p.x/TILE)*TILE;if(Math.abs(ax-p.x)<=12&&!blocked(ax,p.y+dy)){p.x+=Math.sign(ax-p.x)*2;}}
  }
  if(S.mode==="boss"&&S.boss&&S.boss.php>0)bossUpdate();
  if(S.mode==="maze"&&S.maze)mazeUpdate();
  const r=room();
  if(!r.open&&S.t%1200===0){S.risk=clamp(S.risk+1,0,100);riskFlags();hud();}   // exposure creeps while a door is still shut
  if(r.clock&&!r.open&&S.mode==="play"&&S.rs&&(r.clock-(Date.now()-S.rs.start)/1000)<=0){clockOut(r);return;}
  const c=Math.floor((p.x+16)/TILE),rr=Math.floor((p.y+24)/TILE);
  if(r.sideDoor&&S.mode==="play"&&c===r.sideDoor.x&&rr===r.sideDoor.y){const i=ROOMS.findIndex(x=>x.id===r.sideDoor.to);if(i>=0){enterSide(i,null);return;}}
  if(r.hub&&S.mode==="play"&&r.map[rr]&&r.map[rr][c]==="A"){
    const k=r.doors.findIndex(d=>d.x===c&&d.y===rr);
    if(k>=0){
      const id=r.annexes[k]; const i=ROOMS.findIndex(x=>x.id===id); if(i>=0){enterSide(i,r.doors[k]);return;}
    }
  }
  if(r.open&&(S.mode==="play"||S.mode==="boss"||S.mode==="maze")){if(c===r.exit.x&&rr===r.exit.y){sfx("door");if(r.side)returnFromSide(r);else if(r.final)showEnd();else{const nx=ROOMS.findIndex((x,k)=>k>S.roomIdx&&!x.side);if(nx>=0)enterRoom(nx);}}}
}
function clockOut(r){
  S.mode="dialog"; sfx("alarm"); S.score-=5; bump(0,10); hud();
  show(speakerBox("Amira","Dev lead")+'<div class="delta bad">Five minutes. That was the deal. -5, risk +10.</div><p>The engineers put their headphones back on. Come back when you are faster: the annex starts over.</p><div class="row"><button class="btn primary" id="go">Back to the door</button></div>',"full");
  overlay.querySelector("#go").onclick=()=>{hide();checkIncident(()=>{resetRoom(r);enterRoom(S.roomIdx);});};
}
function nearest(){
  const p=S.player, rm=room(); let best=null,bd=48;
  const consider=(x,y,obj,pending)=>{let d=Math.hypot((x*TILE+16)-(p.x+16),(y*TILE+16)-(p.y+16));if(d>=48)return;if(pending)d-=8;if(d<bd){bd=d;best=obj;}};
  rm.npcs.forEach(n=>{if(!npcHidden(n))consider(n.x,n.y,{type:"npc",n},npcPending(n));});
  rm.objects.forEach(o=>{if(!(o.kind==="laptop"&&o.read))consider(o.x,o.y,{type:"obj",o},!o.read&&!o.locked);});
  if(rm.auditor)consider(rm.auditor.cur.x,rm.auditor.cur.y,{type:"auditor"},!rm.open&&progress(rm).complete);
  return best;
}
function action(){
  if(S.mode==="boss"){swing();return;}
  if(S.mode==="maze")return;
  const t=nearest(); if(!t)return;
  if(t.type==="auditor"){sfx("talk");talkAuditor();return;}
  if(t.type==="obj"){openObject(t.o);return;}
  const n=t.n; sfx("talk");
  const sc=n.q[n.done];
  if(n.returns&&!n.returned&&S[ITEMS[n.returns.item]]){
    const rt=n.returns, rw=rt.reward||{pts:10};
    n.returned=true; S[ITEMS[rt.item]]=false; S.score+=rw.pts; sfx("reward"); if(rw.trust)S.trust=clamp(S.trust+rw.trust,0,100); hud(); S.mode="dialog";
    S.log.push({who:n.name+" ("+n.role+")",q:"Return of assets",a:rt.item+" returned",pts:rw.pts,grade:"g"});
    show(speakerBox(n.name,n.role)+'<div class="delta good">'+esc(rt.item.charAt(0).toUpperCase()+rt.item.slice(1))+' returned. +'+rw.pts+(rw.trust?', Trust +'+rw.trust:'')+'</div><p>'+esc(rt.text)+'</p>'+(rt.line?'<div class="fb"><b class="line">'+esc(rt.line)+'</b></div>':'')+'<div class="row"><button class="btn primary" id="go">Continue</button></div>',"dialog");
    overlay.querySelector("#go").onclick=()=>{hide();S.mode="play";hud();};
    return;
  }
  if(!npcReady(n)){simple(n.name,n.role,(sc&&sc.after&&sc.wait)||n.wait||"Not now. Somebody else needs you first.");return;}
  if(!sc&&n.trustGate&&S.trust<n.trustGate.min){
    const g=n.trustGate, pick=g.pool[(n.tgIdx||0)%g.pool.length]; n.tgIdx=(n.tgIdx||0)+1;
    simple(n.name,n.role,g.intro+" Trust is at "+S.trust+", I want "+g.min+".","Go on",()=>openScenario(null,{speaker:{name:n.name,role:n.role},text:pick.text,line:pick.line,options:pick.options},()=>{S.mode="play";hud();}));
    return;
  }
  if(n.mini==="firewall"){hackerTalk(n);return;}
  if(n.talk!==undefined){caseTalk(n);return;}
  if(!sc){simple(n.name,n.role,n.lines?nextLine(n):n.idle);return;}
  if(sc.lookup){
    const o=room().objects.find(x=>x.id===sc.lookup);
    if(o&&!o.read){
      if(!sc.asked){sc.asked=true;o.locked=false;simple(n.name,n.role,sc.ask,"On it",()=>{S.banner={text:"Find: "+o.title.split(":")[0]+". Then come back to "+n.name+".",until:S.t+300};S.mode="play";});}
      else simple(n.name,n.role,sc.remind||("Have you looked at the "+o.title.split(":")[0].toLowerCase()+" yet?"));
      return;
    }
  }
  if(sc.item&&!sc.delivered){
    const flag=ITEMS[sc.item];
    if(!S[flag]){simple(n.name,n.role,sc.remind||("Do you have the "+sc.item+"? I need it."));return;}
    S[flag]=false; sc.delivered=true; sfx("reward");
    const rw=sc.reward||{pts:5}; S.score+=rw.pts; if(rw.trust)S.trust=clamp(S.trust+rw.trust,0,100); hud(); S.mode="dialog";
    const head=sc.item.charAt(0).toUpperCase()+sc.item.slice(1)+" delivered. +"+rw.pts+(rw.trust?", Trust +"+rw.trust:"");
    show(speakerBox(n.name,n.role)+'<div class="delta good">'+esc(head)+'</div><p>'+esc(sc.deliver||"Thank you.")+'</p><div class="row"><button class="btn primary" id="go">Go on</button></div>',"dialog");
    overlay.querySelector("#go").onclick=()=>{hide();if(sc.number&&!sc.numDone)numberPrompt(n,sc);else afterNumber(n,sc);};
    return;
  }
  if(sc.number&&!sc.numDone){numberPrompt(n,sc);return;}
  afterNumber(n,sc);
}
/* ---------- ask, find, apply ---------- */
function npcReady(n){
  const sc=n.q[n.done];
  const after=(sc&&sc.after)||n.after;
  if(!after)return true;
  const dep=room().npcs.find(x=>x.who===after);
  if(!dep)return true;
  const gatedAt=dep.q.findIndex(x=>x.after);           // questions behind a per-question gate do not count
  return dep.done>=(gatedAt<0?dep.q.length:gatedAt);
}
function npcHidden(n){return !!(n.mini&&room().hackDone);}
function nextLine(n){const t=n.lines[(n.li||0)%n.lines.length];n.li=(n.li||0)+1;return t;}
function npcPending(n){
  if(npcHidden(n))return false;
  if(n.lines&&!n.li)return true;
  if(n.returns&&!n.returned&&S[ITEMS[n.returns.item]])return true;
  const sc=n.q[n.done]; if(!sc||!npcReady(n))return false;
  if(sc.lookup){const o=room().objects.find(x=>x.id===sc.lookup);if(o&&!o.read&&sc.asked)return false;}
  return true;
}
function nextObjective(r){
  if(r.hacker&&!r.hackDone)return "Stop the hacker on Henrik's laptop";
  for(const n of r.npcs){
    if(!npcReady(n))continue;
    const sc=n.q[n.done]; if(!sc)continue;
    if(sc.lookup){const o=r.objects.find(x=>x.id===sc.lookup);if(o&&!o.read)return sc.asked?"Find: "+o.title.split(":")[0]+", then back to "+n.name:"Talk to "+n.name+", the "+n.role.toLowerCase();}
    return "Talk to "+n.name+", the "+n.role.toLowerCase();
  }
  return null;
}
function numberPrompt(n,sc){
  const o=sc.lookup?room().objects.find(x=>x.id===sc.lookup):null;
  S.mode="dialog";
  show(speakerBox(n.name,n.role)+'<p>'+esc(sc.number.q)+'</p><div class="row"><input class="clause" id="ans" autocomplete="off" inputmode="'+(sc.number.ph?"text":"decimal")+'" placeholder="'+esc(sc.number.ph||"e.g. 4.3")+'"><button class="btn primary" id="go">Answer</button></div>'+hintButton(),"dialog");
  wireHint(()=>o?"It is the item called '"+o.title+"'.":"Think about which clause group this belongs to.");
  const inp=overlay.querySelector("#ans");
  const submit=()=>{
    if(answerOk(inp.value,sc.number)){
      sc.numDone=true; S.score+=5; if(o)o.recalled=true; hud(); sfx("good");
      show(speakerBox(n.name,n.role)+'<div class="delta good">'+esc(sc.number.a)+'. Correct. +5</div><div class="row"><button class="btn primary" id="go">Go on</button></div>',"dialog");
      overlay.querySelector("#go").onclick=()=>{hide();afterNumber(n,sc);};
    }else{
      sc.misses=(sc.misses||0)+1; S.score-=3; hud(); sfx("bad"); addMiss(sc.number.q,sc.number.a,3);
      const hint=sc.misses>=2&&o?"It is written on the "+o.title.split(":")[0].toLowerCase()+". Go and look again, the number is right there.":(o?"Not that one. Check the "+o.title.split(":")[0].toLowerCase()+" again.":"Not that one. Think about which clause group this belongs to.");
      show(speakerBox(n.name,n.role)+'<div class="delta bad">No. -3</div><p>'+esc(hint)+'</p><div class="row"><button class="btn primary" id="go">Step back</button></div>',"dialog");
      overlay.querySelector("#go").onclick=()=>{hide();S.mode="play";};
    }
  };
  inp.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();submit();}});
  overlay.querySelector("#go").onclick=submit;
}

/* ================= drawing ================= */
function R(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(x,y,w,h);}
const OUT="#1b1a2e", WOOD="#8b5a2b", WOODL="#a86f3a", WOODD="#5e3b1a", PAPER="#f4f2ea", NAVY="#2f3550";
const shadeCache={};
function sh(h,f){
  const k=h+f; if(shadeCache[k])return shadeCache[k];
  const c=[1,3,5].map(i=>parseInt(h.slice(i,i+2),16)).map(v=>clamp(Math.round(f>0?v+(255-v)*f:v*(1+f)),0,255));
  return shadeCache[k]="#"+c.map(v=>v.toString(16).padStart(2,"0")).join("");
}
function hash(x,y){let n=(x*73856093)^(y*19349663);n=Math.imul(n^(n>>>13),1274126177);return ((n^(n>>>16))>>>0)%1000;}
function hasObject(cx,cy){return room().objects.some(o=>o.x===cx&&o.y===cy);}
function drawTile(ch,x,y,pal){

    else if(rm.caseHouse){msg="Search, inspect, show. Space on people and things.";}
    else{const pr=progress(rm);const nx=rm.gated?nextObjective(rm):null;msg=rm.open?(rm.final?"The gate is open. Walk through it.":"The door is open. Walk through."):(pr.complete?"Room complete. Talk to the auditor at the door.":(nx?"Next: "+nx:"Talk to all, read all items, then see the auditor."));}
  }else if(S.mode==="boss"){col="#f2c14e";msg=rm.open?"Door open. Walk through.":(S.hasLaptop?"Get close. Space to swing the laptop.":"Get the laptop behind Sven. Space to pick it up.");}
  else if(S.mode==="maze"){col="#f2c14e";msg=rm.open?"Door open. Run for it.":"Tokens "+S.maze.tokens+"/"+rm.need+". Viktor wants your budget.";}
  setMsg(msg,col!=="#a9a6c9");
  if(rm.clock&&!rm.open&&S.rs&&S.mode!=="title"){const left=Math.max(0,rm.clock-(Date.now()-S.rs.start)/1000);R(cv.width-78,6,72,18,"rgba(27,26,46,.85)");drawText(fmtT(left),cv.width-70,19,left<=30&&(S.t>>4)%2?"#ef6f6c":"#f2c14e",10);}
  if(S.banner&&S.t<S.banner.until){
    const lines=wrap(S.banner.text,60); const hgt=12+lines.length*14;
    R(0,40,cv.width,hgt,"rgba(27,26,46,.92)");R(0,40,cv.width,2,"#f2c14e");R(0,40+hgt-2,cv.width,2,"#f2c14e");
    lines.forEach((l,i)=>drawText(l,8,56+i*14,"#f2c14e",8));
  }else if(S.banner&&S.t>=S.banner.until){S.banner=null;}
  if(S.mode==="title")drawTitle();
}
let lastMsg=null;
function setMsg(m,hot){const k=m+(hot?1:0);if(k===lastMsg)return;lastMsg=k;msgEl.textContent=m||"\u00a0";msgEl.classList.toggle("dim",!hot);}
function wrap(txt,n){const out=[];let line="";txt.split(" ").forEach(w=>{if((line+" "+w).trim().length>n){out.push(line.trim());line=w;}else line=(line+" "+w);});if(line.trim())out.push(line.trim());return out;}
function drawTitle(){
  R(0,0,cv.width,cv.height,"rgba(10,9,24,.6)");
  for(let y=0;y<cv.height;y+=4)R(0,y,cv.width,1,"rgba(0,0,0,.12)");
  const t=S.t; ctx.textAlign="center";
  ctx.font="44px 'Press Start 2P','Courier New',monospace";
  const cx=cv.width/2, cy=118;
  ctx.fillStyle="#1b1a2e";ctx.fillText("ISMS QUEST",cx+8,cy+8);
  ctx.fillStyle="#7a2f2f";ctx.fillText("ISMS QUEST",cx+5,cy+5);
  ctx.fillStyle="#c0392b";ctx.fillText("ISMS QUEST",cx+3,cy+3);
  ctx.fillStyle="#f2c14e";ctx.fillText("ISMS QUEST",cx,cy);
  ctx.fillStyle="#fff3c4";ctx.fillText("ISMS QUEST",cx-1,cy-2);
  ctx.fillStyle="#f2c14e";ctx.fillText("ISMS QUEST",cx,cy);
  ctx.font="10px 'Press Start 2P','Courier New',monospace";
  ctx.fillStyle="#1b1a2e";ctx.fillText("THE LEAD IMPLEMENTER",cx+1,cy+31);ctx.fillStyle="#7cc0ff";ctx.fillText("THE LEAD IMPLEMENTER",cx,cy+30);
  ctx.font="8px 'Press Start 2P','Courier New',monospace";
  if((t>>5)%2===0){ctx.fillStyle="#a9a6c9";ctx.fillText("ISO/IEC 27001:2022  CLAUSES 4 TO 10  ANNEX A",cx,cy+52);}
  ctx.fillStyle="#6c6f8f";ctx.fillText("A CHAOTIC CONSULTING PRODUCTION",cx,cv.height-30);
  ctx.textAlign="left";
}
function loop(){update();render();requestAnimationFrame(loop);}

hud();
const startRoom=roomIndexOf(DEV.room);
if(startRoom>=0)jumpTo(startRoom); else showTitle();
loop();
})();
